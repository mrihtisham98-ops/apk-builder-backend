<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>App Studio</title>
 <style>
 body {
 font-family: system-ui, sans-serif;
 background: #0f172a;
 color: white;
 display: flex;
 justify-content: center;
 align-items: center;
 min-height: 100vh;
 margin: 0;
 }
 .card {
 background: #1e293b;
 padding: 24px;
 border-radius: 16px;
 text-align: center;
 }
 .btn {
 background: #2563eb;
 color: white;
 border: none;
 padding: 10px 20px;
 border-radius: 8px;
 cursor: pointer;
 }
 </style>
</head>
<body>
 <div class="card">
 <h2>Web App Studio</h2>
 <p>Native Mobile & Responsive Environment</p>
 <button class="btn" onclick="sayHello()">Interactive Action</button>
 </div>
 <script>
 function sayHello() {
 alert('Hello from inline script!');
 }
 </script>
</body>
</html>
