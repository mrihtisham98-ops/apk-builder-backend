          PY

          # Add Google Mobile Ads SDK dependency only for enabled builds.
          if ! grep -q "play-services-ads" myapp/app/build.gradle; then
            cat >> myapp/app/build.gradle <<'EOF'

          dependencies {
              implementation 'com.google.android.gms:play-services-ads:23.2.0'
          }
          EOF
          fi

          echo "AdMob SDK and Java bridge configured."

      # ============================================================
      # Verify AdMob configuration only if AdMob is enabled.
      # ============================================================
      - name: Verify New AdMob Integration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="myapp/app/src/main/assets/admob.config.json"

          if [ ! -f "$CONFIG" ]; then
            echo "AdMob is not configured. Skipping verification."
            exit 0
          fi

          ENABLED=$(python3 -c "import json; print(str(json.load(open('$CONFIG')).get('enabled', False)).lower())")

          if [ "$ENABLED" != "true" ]; then
            echo "AdMob disabled. Skipping verification."
            exit 0
          fi

          grep -q "play-services-ads" myapp/app/build.gradle
          grep -q "AdMobBridge" myapp/app/src/main/java/*/*/*/AdMobBridge.java 2>/dev/null || \
          find myapp/app/src/main/java -name "AdMobBridge.java" | grep -q .

          grep -q "com.google.android.gms.ads.APPLICATION_ID" \
            myapp/app/src/main/AndroidManifest.xml

          echo "AdMob integration verification passed."

      # ============================================================
      # AndroidX (ADDED) — Jetifier + AndroidX support
      # ============================================================
      - name: Enable AndroidX
        run: |
          cat > myapp/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Install Gradle 8.0
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.0/bin/gradle wrapper --gradle-version 8.0 --project-dir myapp

      - name: Build APK
        run: |
          cd myapp
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK to Public GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ID: ${{ github.event.client_payload.buildId }}
        run: |
          APK="myapp/app/build/outputs/apk/debug/app-debug.apk"
          TAG="apk-${BUILD_ID}"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file not found."
            exit 1
          fi

          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "APK ${BUILD_ID}" \
            --notes "Your APK build is complete."

      - name: Delete Temporary Build Branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_REF: ${{ github.event.client_payload.ref }}
        run: |
          if [ -n "$BUILD_REF" ]; then
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BUILD_REF}" \
              || echo "Temporary branch was already deleted."
          fi

      # ============================================================
      # Delete Temporary Build Branch (ADDED — fallback, github.token)
      # Original fallback step preserved.
