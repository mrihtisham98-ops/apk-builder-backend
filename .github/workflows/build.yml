name: Build Real APK

run-name: Build APK ${{ github.event.client_payload.buildId }}

on:
  repository_dispatch:
    types: [build_apk]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Temporary Build Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || github.event.repository.default_branch }}
          path: source

      # ============================================================
      # R2 BUILD INPUT — download the uploaded ZIP and create the
      # same folder structure used by the legacy Git-branch builds.
      # ============================================================
      - name: Download and Prepare R2 Build Input
        if: ${{ github.event.client_payload.source == 'r2' }}
        env:
          BUILD_ID: ${{ github.event.client_payload.buildId }}
          DOWNLOAD_URL: ${{ github.event.client_payload.downloadUrl }}
          CONFIG_JSON: ${{ toJson(github.event.client_payload.config) }}
        run: |
          python3 - <<'PY'
          import io
          import json
          import os
          import shutil
          import urllib.request
          import zipfile
          from pathlib import Path, PurePosixPath

          build_id = os.environ.get("BUILD_ID", "").strip()
          download_url = os.environ.get("DOWNLOAD_URL", "").strip()
          config_json = os.environ.get("CONFIG_JSON", "").strip()

          if not build_id:
              raise SystemExit("ERROR: R2 buildId is missing.")
          if not download_url:
              raise SystemExit("ERROR: R2 downloadUrl is missing.")
          if not config_json:
              raise SystemExit("ERROR: R2 build config payload is missing.")

          try:
              config = json.loads(config_json)
          except json.JSONDecodeError as error:
              raise SystemExit("ERROR: Invalid build config JSON: " + str(error))

          if not isinstance(config, dict):
              raise SystemExit("ERROR: Build config must be a JSON object.")

          source_dir = Path("source/.build-input") / build_id
          project_dir = source_dir / "project"
          source_dir.mkdir(parents=True, exist_ok=True)

          print("Downloading project ZIP from Cloudflare R2...")
          request = urllib.request.Request(
              download_url,
              headers={"User-Agent": "Web-App-Studio-APK-Builder"}
          )
          with urllib.request.urlopen(request, timeout=180) as response:
              zip_bytes = response.read()

          if not zip_bytes:
              raise SystemExit("ERROR: Downloaded R2 ZIP is empty.")

          print("Downloaded ZIP bytes:", len(zip_bytes))

          project_dir.mkdir(parents=True, exist_ok=True)

          try:
              archive = zipfile.ZipFile(io.BytesIO(zip_bytes))
          except zipfile.BadZipFile:
              raise SystemExit("ERROR: R2 file is not a valid ZIP archive.")

          with archive:
              file_names = [
                  name for name in archive.namelist()
                  if name and not name.endswith("/")
              ]

              # Support both ZIP layouts:
              # 1) index.html at ZIP root
              # 2) one enclosing folder such as project/index.html
              prefix = ""
              if "index.html" not in file_names:
                  index_candidates = [
                      name[:-len("index.html")]
                      for name in file_names
                      if name.endswith("/index.html")
                  ]
                  if len(index_candidates) == 1:
                      prefix = index_candidates[0]
                  else:
                      raise SystemExit(
                          "ERROR: ZIP must contain a root index.html "
                          "or one folder containing index.html."
                      )

              extracted = 0
              for member in archive.infolist():
                  if member.is_dir():
                      continue

                  raw_name = member.filename
                  if prefix:
                      if not raw_name.startswith(prefix):
                          continue
                      raw_name = raw_name[len(prefix):]

                  relative = PurePosixPath(raw_name)
                  if (
                      not raw_name
                      or relative.is_absolute()
                      or ".." in relative.parts
                      or "\\" in raw_name
                  ):
                      raise SystemExit(
                          "ERROR: Unsafe file path inside ZIP: " + member.filename
                      )

                  destination = project_dir.joinpath(*relative.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)

                  with archive.open(member) as source_file, destination.open("wb") as target_file:
                      shutil.copyfileobj(source_file, target_file)

                  extracted += 1

          if not (project_dir / "index.html").is_file():
              raise SystemExit("ERROR: ZIP extraction did not produce project/index.html.")

          build_config = {
              "buildId": build_id,
              "appName": str(config.get("appName") or "App")[:60],
              "packageName": config.get("packageName") or "com.example.app",
              "iconPath": config.get("iconPath")
          }

          (source_dir / "build-config.json").write_text(
              json.dumps(build_config, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          admob_config = config.get("adMob")
          if isinstance(admob_config, dict):
              (project_dir / "admob.config.json").write_text(
                  json.dumps(admob_config, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )

          print("R2 project files extracted:", extracted)
          print("Build config created:", source_dir / "build-config.json")
          print("Project index exists:", (project_dir / "index.html").is_file())
          print("R2 build input preparation completed.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Python Image Support
        run: pip install Pillow

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Read Build Configuration and Copy Project
        env:
          BUILD_ID: ${{ github.event.client_payload.buildId }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from PIL import Image, ImageOps

          build_id = os.environ["BUILD_ID"]
          source = Path("source/.build-input") / build_id
          config_file = source / "build-config.json"
          project = source / "project"

          if not config_file.is_file():
              raise SystemExit("ERROR: build-config.json not found.")

          config = json.loads(config_file.read_text(encoding="utf-8"))

          app_name = config.get("appName", "My Web App")
          package_name = config.get("packageName", "")
          icon_path = config.get("iconPath")

          if not re.fullmatch(
              r"[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+",
              package_name
          ):
              raise SystemExit("ERROR: Invalid package name.")

          if not (project / "index.html").is_file():
              raise SystemExit("ERROR: Root index.html is missing.")

          root = Path("myapp")
          assets = root / "app/src/main/assets"
          java_dir = root / "app/src/main/java" / Path(*package_name.split("."))

          assets.mkdir(parents=True, exist_ok=True)
          java_dir.mkdir(parents=True, exist_ok=True)

          shutil.copytree(project, assets, dirs_exist_ok=True)

          # Verify copied HTML project assets
          all_files = [p for p in assets.rglob("*") if p.is_file()]
          total_size = sum(p.stat().st_size for p in all_files)

          print("========== ASSET VERIFICATION ==========")
          print("Total files copied:", len(all_files))
          print("Total asset size:", round(total_size / (1024 * 1024), 2), "MB")
          print("Index HTML exists:", (assets / "index.html").is_file())

          for file in all_files[:50]:
              print("ASSET:", file.relative_to(assets))

          print("========================================")

          # Create Android manifest.
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)

          manifest = ET.Element("manifest")
          manifest.set("package", package_name)

          permission = ET.SubElement(manifest, "uses-permission")
          permission.set(
              f"{{{android_ns}}}name",
              "android.permission.INTERNET"
          )

          application = ET.SubElement(manifest, "application")
          application.set(f"{{{android_ns}}}label", app_name)
          application.set(
              f"{{{android_ns}}}theme",
              "@android:style/Theme.Material.Light.NoActionBar"
          )
          application.set(
              f"{{{android_ns}}}usesCleartextTraffic",
              "true"
          )

          activity = ET.SubElement(application, "activity")
          activity.set(
              f"{{{android_ns}}}name",
              ".MainActivity"
          )
          activity.set(
              f"{{{android_ns}}}exported",
              "true"
          )

          intent = ET.SubElement(activity, "intent-filter")
          action = ET.SubElement(intent, "action")
          action.set(
              f"{{{android_ns}}}name",
              "android.intent.action.MAIN"
          )

          category = ET.SubElement(intent, "category")
          category.set(
              f"{{{android_ns}}}name",
              "android.intent.category.LAUNCHER"
          )

          manifest_path = root / "app/src/main/AndroidManifest.xml"
          manifest_path.parent.mkdir(parents=True, exist_ok=True)

          # =====================================================
          # CUSTOM APP ICON FIX
          # Locate the uploaded image and create Android icons.
          # =====================================================

          print("========== APP ICON DETECTION ==========")
          print("Configured iconPath:", repr(icon_path))

          supported_extensions = {
              ".png", ".jpg", ".jpeg", ".webp"
          }

          icon_file = None

          # 1. First try the exact iconPath from build-config.json.
          if icon_path and isinstance(icon_path, str):
              configured_file = (source / icon_path).resolve()
              source_resolved = source.resolve()

              try:
                  configured_file.relative_to(source_resolved)
              except ValueError:
                  raise SystemExit(
                      "ERROR: Icon path is outside build directory."
                  )

              if configured_file.is_file():
                  icon_file = configured_file
                  print("Icon found using iconPath:", icon_file)

              else:
                  print("Configured iconPath file not found.")

          # 2. Search common icon filenames if iconPath is missing.
          if icon_file is None:
              preferred_names = [
                  "app-icon.png",
                  "app-icon.jpg",
                  "app-icon.jpeg",
                  "app-icon.webp",
                  "app_icon.png",
                  "app_icon.jpg",
                  "icon.png",
                  "icon.jpg",
                  "icon.jpeg",
                  "icon.webp",
                  "launcher.png",
                  "launcher.jpg",
                  "launcher.webp"
              ]

              for filename in preferred_names:
                  candidate = source / filename

                  if candidate.is_file():
                      icon_file = candidate
                      print("Icon found using filename:", candidate)
                      break

          # 3. Search uploaded image files outside the project folder.
          if icon_file is None:
              image_candidates = []

              for candidate in source.rglob("*"):
                  if not candidate.is_file():
                      continue

                  if "project" in candidate.relative_to(source).parts:
                      continue

                  if candidate.name == "build-config.json":
                      continue

                  if candidate.suffix.lower() in supported_extensions:
                      image_candidates.append(candidate)

              named_candidates = [
                  item for item in image_candidates
                  if "icon" in item.stem.lower()
                  or "launcher" in item.stem.lower()
                  or "logo" in item.stem.lower()
              ]

              if len(named_candidates) == 1:
                  icon_file = named_candidates[0]

              elif len(image_candidates) == 1:
                  icon_file = image_candidates[0]

              elif len(named_candidates) > 1:
                  raise SystemExit(
                      "ERROR: Multiple possible icon images found. "
                      "Please provide a clear iconPath in build-config.json."
                  )

              elif len(image_candidates) > 1:
                  raise SystemExit(
                      "ERROR: Multiple images found and no clear app icon "
                      "could be identified."
                  )

          icon_enabled = False

          if icon_file is not None:
              print("SELECTED ICON:", icon_file)
              print("ICON EXISTS:", icon_file.is_file())

              try:
                  with Image.open(icon_file) as original:
                      original.load()
                      image = ImageOps.exif_transpose(original).convert("RGBA")

                  if image.width < 1 or image.height < 1:
                      raise ValueError("Invalid image dimensions.")

                  print(
                      "Original icon dimensions:",
                      image.width,
                      "x",
                      image.height
                  )

                  # Make a square transparent launcher image.
                  # This preserves the complete uploaded image.
                  for folder, size in [
                      ("mipmap-mdpi", 48),
                      ("mipmap-hdpi", 72),
                      ("mipmap-xhdpi", 96),
                      ("mipmap-xxhdpi", 144),
                      ("mipmap-xxxhdpi", 192)
                  ]:
                      target = root / "app/src/main/res" / folder
                      target.mkdir(parents=True, exist_ok=True)

                      resized = ImageOps.contain(
                          image,
                          (size, size),
                          method=Image.Resampling.LANCZOS
                      )

                      canvas = Image.new(
                          "RGBA",
                          (size, size),
                          (0, 0, 0, 0)
                      )

                      x = (size - resized.width) // 2
                      y = (size - resized.height) // 2

                      canvas.alpha_composite(resized, (x, y))

                      output_file = target / "ic_launcher.png"
                      canvas.save(output_file, format="PNG")

                      print(
                          "CREATED ICON:",
                          output_file,
                          output_file.stat().st_size,
                          "bytes"
                      )

                  # Set both standard and round launcher icons.
                  application.set(
                      f"{{{android_ns}}}icon",
                      "@mipmap/ic_launcher"
                  )

                  application.set(
                      f"{{{android_ns}}}roundIcon",
                      "@mipmap/ic_launcher"
                  )

                  icon_enabled = True

                  print("CUSTOM ICON GENERATED SUCCESSFULLY.")

              except Exception as error:
                  raise SystemExit(
                      "ERROR: Could not process uploaded app icon: "
                      + str(error)
                  )

          else:
              if icon_path:
                  raise SystemExit(
                      "ERROR: iconPath was provided but no valid icon "
                      "image was found."
                  )

              print(
                  "WARNING: No custom icon was uploaded. "
                  "Android default icon will be used."
              )

          # Write the final manifest after setting icon attributes.
          ET.ElementTree(manifest).write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True
          )

          # Verify generated launcher icons.
          if icon_enabled:
              for folder in [
                  "mipmap-mdpi",
                  "mipmap-hdpi",
                  "mipmap-xhdpi",
                  "mipmap-xxhdpi",
                  "mipmap-xxxhdpi"
              ]:
                  generated = (
                      root / "app/src/main/res" / folder / "ic_launcher.png"
                  )

                  if not generated.is_file() or generated.stat().st_size == 0:
                      raise SystemExit(
                          "ERROR: Launcher icon missing: " + str(generated)
                      )

              check_tree = ET.parse(manifest_path)
              check_application = check_tree.getroot().find("application")

              if check_application is None:
                  raise SystemExit("ERROR: Application element missing.")

              if check_application.get(
                  f"{{{android_ns}}}icon"
              ) != "@mipmap/ic_launcher":
                  raise SystemExit("ERROR: android:icon was not configured.")

              if check_application.get(
                  f"{{{android_ns}}}roundIcon"
              ) != "@mipmap/ic_launcher":
                  raise SystemExit(
                      "ERROR: android:roundIcon was not configured."
                  )

              print("LAUNCHER ICON VERIFICATION PASSED.")

          # Create MainActivity with Android WebView file picker support.
          # FIX 1: WebViewAssetLoader is used so woff2 fonts load correctly
          # and Font Awesome icons render properly. file:// URLs block
          # cross-origin font loading on Android 7+ which causes invisible
          # but clickable icons.
          java_code = f'''package {package_name};

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.ValueCallback;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.content.ActivityNotFoundException;

          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {{
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();

                  webView.setWebViewClient(new WebViewClient() {{
                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                              WebView view, WebResourceRequest request) {{
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }}
                  }});

                  webView.setWebChromeClient(new WebChromeClient() {{
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {{

                          if (MainActivity.this.filePathCallback != null) {{
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                              MainActivity.this.filePathCallback = null;
                          }}

                          MainActivity.this.filePathCallback = filePathCallback;

                          try {{
                              Intent intent = fileChooserParams.createIntent();
                              startActivityForResult(
                                  intent,
                                  FILE_CHOOSER_REQUEST_CODE
                              );
                              return true;
                          }} catch (ActivityNotFoundException exception) {{
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }}
                      }}
                  }});

                  webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
                  setContentView(webView);
              }}

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {{
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {{
                      if (filePathCallback == null) {{
                          return;
                      }}

                      Uri[] results = null;

                      if (resultCode == Activity.RESULT_OK && data != null) {{
                          results = WebChromeClient.FileChooserParams.parseResult(
                              resultCode,
                              data
                          );
                      }}

                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }}
              }}

              @Override
              public void onBackPressed() {{
                  if (webView != null && webView.canGoBack()) {{
                      webView.goBack();
                  }} else {{
                      super.onBackPressed();
                  }}
              }}
          }}
          '''

          (java_dir / "MainActivity.java").write_text(
              java_code,
              encoding="utf-8"
          )

          print("Project files copied successfully.")
          print("App:", app_name)
          print("Package:", package_name)
          print("Custom icon enabled:", icon_enabled)
          PY

      # ============================================================
      # COMPILE TAILWIND LOCALLY
      # The Tailwind Play CDN is a browser-side runtime compiler.
      # Compile utility classes during the GitHub build instead, so
      # the APK does not depend on a CDN or runtime network access.
      # ============================================================
      - name: Compile Tailwind CSS for WebView
        run: |
          set -euo pipefail
          ASSETS="myapp/app/src/main/assets"
          if [ ! -f "$ASSETS/index.html" ]; then
            echo "ERROR: index.html not found before Tailwind compilation."
            exit 1
          fi

          mkdir -p "$ASSETS/_generated"
          cat > /tmp/tailwind.input.css <<'CSS'
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
          CSS

          cat > /tmp/tailwind.config.cjs <<'JS'
          const path = require("path");

          // Use absolute paths because this config file is stored in /tmp.
          // Relative content globs would incorrectly scan /tmp/myapp/...,
          // instead of the actual project assets directory.
          const assetsDir = path.join(
            process.cwd(),
            "myapp",
            "app",
            "src",
            "main",
            "assets"
          );

          module.exports = {
            content: [
              path.join(assetsDir, "**/*.html"),
              path.join(assetsDir, "**/*.js"),
              path.join(assetsDir, "**/*.jsx"),
              path.join(assetsDir, "**/*.ts"),
              path.join(assetsDir, "**/*.tsx")
            ],
            theme: { extend: {} },
            plugins: []
          };
          JS

          npx --yes tailwindcss@3.4.17 \
            --config /tmp/tailwind.config.cjs \
            --input /tmp/tailwind.input.css \
            --output "$ASSETS/_generated/tailwind.css" \
            --minify

          if [ ! -s "$ASSETS/_generated/tailwind.css" ]; then
            echo "ERROR: Tailwind CSS output is missing or empty."
            exit 1
          fi

          echo "========== TAILWIND CSS VERIFICATION =========="
          CSS_BYTES=$(wc -c < "$ASSETS/_generated/tailwind.css")
          echo "Generated Tailwind CSS bytes: $CSS_BYTES"
          if [ "$CSS_BYTES" -lt 10000 ]; then
            echo "WARNING: Generated CSS is unusually small."
            echo "Check whether Tailwind detected the utility classes in the HTML/JS files."
          fi
          head -c 300 "$ASSETS/_generated/tailwind.css"
          echo
          echo "Tailwind CSS compiled and saved inside APK assets."
          echo "==============================================="

      # ============================================================
      # FIX 2 (NEW STEP): Inject local Tailwind CSS link into APK
      # index.html so the APK does not depend on the Tailwind Play CDN
      # at runtime. This replaces the CDN <script> tag with a local
      # <link> tag pointing at _generated/tailwind.css.
      #
      # IMPORTANT: This step ONLY modifies the APK copy of index.html
      # (myapp/app/src/main/assets/index.html). The original index.html
      # on Vercel / GitHub is NOT touched, so the online version keeps
      # its original working design.
      # ============================================================
      - name: Inject Tailwind CSS link into APK index.html
        run: |
          set -euo pipefail
          ASSETS="myapp/app/src/main/assets"
          INDEX="$ASSETS/index.html"
          if [ ! -f "$INDEX" ]; then
            echo "ERROR: index.html missing before Tailwind injection."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("myapp/app/src/main/assets/index.html")
          html = p.read_text(encoding="utf-8")

          # Match the real HTML script element, including an optional
          # non-empty body. Do not match escaped script markup inside JS
          # template strings (for example: <\/script>).
          pattern = re.compile(
              r'<script\b(?=[^>]*\bsrc\s*=\s*["\']https://cdn\.tailwindcss\.com(?:/[^"\']*)?(?:\?[^"\']*)?["\'])[^>]*>.*?</script\s*>',
              re.IGNORECASE | re.DOTALL,
          )

          local_link = re.compile(
              r'<link\b(?=[^>]*\bhref\s*=\s*["\']_generated/tailwind\.css["\'])[^>]*>',
              re.IGNORECASE,
          )

          new_html, count = pattern.subn(
              '<link rel="stylesheet" href="_generated/tailwind.css">',
              html,
          )

          if count > 0:
              p.write_text(new_html, encoding="utf-8")
              html = new_html
              print(f"SUCCESS: Replaced {count} Tailwind CDN script tag(s).")
          elif local_link.search(html):
              # Safe rerun: an earlier workflow step/run already added the link.
              print("INFO: Local Tailwind CSS link already exists.")
          else:
              # The source HTML may already have had the CDN script removed
              # by another preparation step. Add the local stylesheet link
              # without requiring any manual edit to the user's index.html.
              link_tag = '<link rel="stylesheet" href="_generated/tailwind.css">'
              if re.search(r'</head\s*>', html, re.IGNORECASE):
                  html = re.sub(
                      r'</head\s*>',
                      link_tag + '\\n</head>',
                      html,
                      count=1,
                      flags=re.IGNORECASE,
                  )
              elif re.search(r'<body\b', html, re.IGNORECASE):
                  html = re.sub(
                      r'<body\b',
                      link_tag + '\\n<body',
                      html,
                      count=1,
                      flags=re.IGNORECASE,
                  )
              else:
                  html = link_tag + '\\n' + html

              p.write_text(html, encoding="utf-8")
              print("INFO: CDN script was absent; inserted local Tailwind CSS link.")

          if not local_link.search(html):
              raise SystemExit(
                  "ERROR: Could not add local _generated/tailwind.css link to APK index.html."
              )

          if pattern.search(html):
              raise SystemExit(
                  "ERROR: Executable Tailwind CDN script remains after injection."
              )

          print("Verified: APK index.html links to local _generated/tailwind.css.")
          PY

          # Verify no executable Tailwind CDN script remains.
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("myapp/app/src/main/assets/index.html").read_text(encoding="utf-8")
          pattern = re.compile(
              r'<script\b(?=[^>]*\bsrc\s*=\s*["\']https://cdn\.tailwindcss\.com(?:/[^"\']*)?(?:\?[^"\']*)?["\'])[^>]*>.*?</script\s*>',
              re.IGNORECASE | re.DOTALL,
          )
          if pattern.search(html):
              raise SystemExit("ERROR: Tailwind CDN script still exists after injection.")
          print("Verified: No Tailwind CDN script remains in APK index.html.")
          PY

      # ============================================================
      # OFFLINE DEPENDENCY BUNDLING SYSTEM (ADDED)
      # Downloads external CSS / JS / fonts / icons / images
      # referenced by HTML and CSS files, saves them locally in
      # the APK assets, rewrites URLs to local relative paths, and
      # writes offline-bundling-report.json.
      # This step never fails the build on download errors — it
      # only reports them.
      # ============================================================
      - name: Offline Dependency Bundling
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          ASSETS = Path("myapp/app/src/main/assets")
          REPORT_PATH = ASSETS / "offline-bundling-report.json"
          LOCAL_VENDOR_DIR = ASSETS / "_offline_vendor"

          DOWNLOAD_TIMEOUT = 30
          MAX_DOWNLOAD_BYTES = 25 * 1024 * 1024
          MAX_RESOURCES = 500
          USER_AGENT = (
              "Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 "
              "(KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"
          )

          # Mime -> extension fallback when URL has no usable suffix.
          MIME_EXT = {
              "text/css": ".css",
              "text/javascript": ".js",
              "application/javascript": ".js",
              "application/x-javascript": ".js",
              "image/png": ".png",
              "image/jpeg": ".jpg",
              "image/jpg": ".jpg",
              "image/gif": ".gif",
              "image/svg+xml": ".svg",
              "image/webp": ".webp",
              "image/x-icon": ".ico",
              "image/vnd.microsoft.icon": ".ico",
              "image/avif": ".avif",
              "font/woff": ".woff",
              "font/woff2": ".woff2",
              "application/font-woff": ".woff",
              "application/font-woff2": ".woff2",
              "font/ttf": ".ttf",
              "application/x-font-ttf": ".ttf",
              "font/otf": ".otf",
              "application/vnd.ms-fontobject": ".eot",
              "video/mp4": ".mp4",
              "video/webm": ".webm",
              "application/json": ".json",
          }

          SAFE_EXT_RE = re.compile(r"^\.[A-Za-z0-9]{1,8}$")

          downloaded = []
          failed = []
          unsupported = []
          already_local = []
          url_cache = {}

          total_downloaded_bytes = 0

          print("========== OFFLINE BUNDLING START ==========")

          if not ASSETS.is_dir():
              print("Assets directory not found — skipping bundling.")
              raise SystemExit(0)

          ASSETS.mkdir(parents=True, exist_ok=True)
          LOCAL_VENDOR_DIR.mkdir(parents=True, exist_ok=True)

          def safe_ext_from_url(url):
              try:
                  path = urllib.parse.urlparse(url).path
              except Exception:
                  return ""
              suffix = Path(path).suffix.lower()
              if suffix and SAFE_EXT_RE.match(suffix):
                  return suffix
              return ""

          def guess_ext(url, content_type):
              ext = safe_ext_from_url(url)
              if ext:
                  return ext
              if content_type:
                  base = content_type.split(";", 1)[0].strip().lower()
                  if base in MIME_EXT:
                      return MIME_EXT[base]
              return ".bin"

          def is_external(url):
              if not url:
                  return False
              u = url.strip()
              if not u:
                  return False
              low = u.lower()
              if low.startswith("data:") or low.startswith("blob:"):
                  return False
              if low.startswith("javascript:") or low.startswith("mailto:"):
                  return False
              if low.startswith("#"):
                  return False
              if low.startswith("//"):
                  return True
              if low.startswith("http://") or low.startswith("https://"):
                  return True
              return False

          def normalize_url(url, base_url):
              if url.startswith("//"):
                  if base_url and base_url.startswith("http://"):
                      url = "http://" + url[2:]
                  else:
                      url = "https://" + url[2:]
              try:
                  return urllib.parse.urljoin(base_url, url)
              except Exception:
                  return url

          def download_resource(url, referer=None):
              """Return (bytes, content_type) or (None, error_string)."""
              if url in url_cache:
                  return url_cache[url]

              headers = {
                  "User-Agent": USER_AGENT,
                  "Accept": "*/*",
              }
              if referer:
                  headers["Referer"] = referer

              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(
                      request, timeout=DOWNLOAD_TIMEOUT
                  ) as response:
                      content_type = response.headers.get("Content-Type", "")
                      chunks = []
                      total = 0
                      while True:
                          chunk = response.read(65536)
                          if not chunk:
                              break
                          total += len(chunk)
                          if total > MAX_DOWNLOAD_BYTES:
                              url_cache[url] = (
                                  None,
                                  "exceeds max download size"
                              )
                              return url_cache[url]
                          chunks.append(chunk)
                      data = b"".join(chunks)
                      if not data:
                          url_cache[url] = (None, "empty response")
                          return url_cache[url]
                      url_cache[url] = (data, content_type)
                      return url_cache[url]
              except urllib.error.HTTPError as e:
                  url_cache[url] = (None, "HTTP " + str(e.code))
                  return url_cache[url]
              except urllib.error.URLError as e:
                  url_cache[url] = (
                      None,
                      "URL error: " + str(e.reason)
                  )
                  return url_cache[url]
              except Exception as e:
                  url_cache[url] = (
                      None,
                      "Download error: " + str(e)
                  )
                  return url_cache[url]

          def local_filename_for_url(url, content_type):
              """Deterministic, collision-free local filename."""
              parsed = urllib.parse.urlparse(url)
              stem = Path(parsed.path).stem or "resource"
              stem = re.sub(r"[^A-Za-z0-9._-]+", "_", stem)[:40]
              if not stem:
                  stem = "resource"
              ext = guess_ext(url, content_type)
              digest = hashlib.sha1(
                  url.encode("utf-8")
              ).hexdigest()[:10]
              return stem + "_" + digest + ext

          def rewrite_url_to_local(original, local_filename, base_url):
              """Compute a browser-relative path from the referencing
              file's folder (base_url is the folder of the referrer,
              not a URL). Returns a relative string using forward slashes."""
              # base_url here is the *file path* of the referrer.
              # We compute relative path from its parent to the local file.
              base_dir = Path(base_url).parent if base_url else Path(".")
              try:
                  rel = os.path.relpath(
                      LOCAL_VENDOR_DIR / local_filename,
                      base_dir
                  ).replace(os.sep, "/")
              except Exception:
                  rel = "_offline_vendor/" + local_filename
              return rel

          def fetch_and_store(url, referer_file, base_url_for_join):
              """Download URL, save to vendor dir, return local filename."""
              global total_downloaded_bytes
              if len(downloaded) >= MAX_RESOURCES:
                  return None
              data, extra = download_resource(url, referer=referer_file)
              if data is None:
                  failed.append({
                      "url": url,
                      "reason": extra,
                      "referer": str(referer_file),
                  })
                  return None
              content_type = extra
              filename = local_filename_for_url(url, content_type)
              target = LOCAL_VENDOR_DIR / filename
              if not target.is_file() or target.stat().st_size == 0:
                  try:
                      target.write_bytes(data)
                  except Exception as e:
                      failed.append({
                          "url": url,
                          "reason": "write failed: " + str(e),
                          "referer": str(referer_file),
                      })
                      return None
                  total_downloaded_bytes += len(data)
              entry = {
                  "url": url,
                  "local_path": str(target.relative_to(ASSETS)),
                  "bytes": len(data),
                  "content_type": content_type,
                  "referer": str(referer_file),
              }
              # De-duplicate by URL
              if not any(d["url"] == url for d in downloaded):
                  downloaded.append(entry)
              return filename

          # ============================================================
          # HTML scanning
          # ============================================================
          ATTR_NAMES_FOR_URLS = {
              "src", "href", "poster", "data", "background", "icon",
          }

          SRC_WITHOUT_DOWNLOAD = {
              "iframe", "frame", "object", "embed", "track",
          }

          SCRIPT_MODULE_RE = re.compile(
              r'<script[^>]*\btype\s*=\s*["\']module["\']',
              re.IGNORECASE,
          )
          DYNAMIC_IMPORT_RE = re.compile(
              r'\bimport\s*\(\s*[\'"`]', re.IGNORECASE
          )
          FETCH_RE = re.compile(
              r'\b(fetch|axios\.(get|post)|XMLHttpRequest)\s*\(', re.IGNORECASE
          )

          # Lightweight HTML attribute regex — not a full parser, but
          # sufficient for static attribute scanning of common tags.
          HTML_URL_ATTR_RE = re.compile(
              r"""(?P<attr>\b(?:src|href|poster|data|background|icon))\s*=\s*"""
              r"""(?:"(?P<dq>[^"]*)"|'(?P<sq>[^']*)'|(?P<bare>[^\s>]+))""",
              re.IGNORECASE,
          )

          SRCSET_RE = re.compile(
              r"""\bsrcset\s*=\s*(?:"(?P<dq>[^"]*)"|'(?P<sq>[^']*)')""",
              re.IGNORECASE,
          )

          STYLE_BLOCK_RE = re.compile(
              r"<style\b[^>]*>(?P<css>.*?)</style>",
              re.DOTALL | re.IGNORECASE,
          )

          INLINE_STYLE_RE = re.compile(
              r"""\bstyle\s*=\s*(?:"(?P<dq>[^"]*)"|'(?P<sq>[^']*)')""",
              re.IGNORECASE,
          )

          CSS_URL_RE = re.compile(
              r"""url\(\s*(?:"(?P<dq>[^"\)]*)"|'(?P<sq>[^'\)]*)'|(?P<bare>[^\)"'\s]+))\s*\)""",
              re.IGNORECASE,
          )

          CSS_IMPORT_RE = re.compile(
              r"""@import\s+(?:url\(\s*)?(?:"(?P<dq>[^"]*)"|'(?P<sq>[^']*)'|(?P<bare>[^\s\)'";]+))""",
              re.IGNORECASE,
          )

          def extract_srcset_urls(value):
              urls = []
              for part in value.split(","):
                  part = part.strip()
                  if not part:
                      continue
                  pieces = part.split()
                  if not pieces:
                      continue
                  urls.append(pieces[0])
              return urls

          def resolve_local_path_for_rewrite(asset_file):
              """Return a path string used by os.path.relpath — must be
              absolute or rooted at CWD consistently. We use the path
              relative to CWD so relpath math is stable."""
              return Path(os.path.relpath(asset_file, Path(".")))

          def process_css_text(css_text, css_file_path, referer_url):
              """Rewrite CSS url()/@import to local paths, download targets.
              Returns new CSS text and list of newly created css files to
              process recursively."""
              new_css = css_text
              new_css_files_to_visit = []

              # @import first (before url()) so we can capture the CSS file.
              def import_repl(match):
                  raw = (
                      match.group("dq")
                      or match.group("sq")
                      or match.group("bare")
                  )
                  if not raw or not is_external(raw):
                      return match.group(0)
                  absolute = normalize_url(raw, referer_url)
                  local = fetch_and_store(
                      absolute,
                      referer_file=css_file_path,
                      base_url_for_join=referer_url,
                  )
                  if not local:
                      return match.group(0)
                  new_css_files_to_visit.append(LOCAL_VENDOR_DIR / local)
                  return "@import url(\"{}\")".format(
                      rewrite_url_to_local(
                          raw, local, str(css_file_path)
                      )
                  )

              new_css = CSS_IMPORT_RE.sub(import_repl, new_css)

              def url_repl(match):
                  raw = (
                      match.group("dq")
                      or match.group("sq")
                      or match.group("bare")
                  )
                  if not raw or not is_external(raw):
                      return match.group(0)
                  absolute = normalize_url(raw, referer_url)
                  local = fetch_and_store(
                      absolute,
                      referer_file=css_file_path,
                      base_url_for_join=referer_url,
                  )
                  if not local:
                      return match.group(0)
                  return "url(\"{}\")".format(
                      rewrite_url_to_local(
                          raw, local, str(css_file_path)
                      )
                  )

              new_css = CSS_URL_RE.sub(url_repl, new_css)
              return new_css, new_css_files_to_visit

          def process_html_file(html_file):
              try:
                  original = html_file.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  try:
                      original = html_file.read_text(
                          encoding="latin-1"
                      )
                  except Exception:
                      return
              except Exception:
                  return

              html_dir = html_file.parent
              base_url = None  # No document base URL — only absolute URLs.

              new_html = original

              # Detect unsupported patterns for the report.
              if SCRIPT_MODULE_RE.search(original):
                  unsupported.append({
                      "file": str(html_file.relative_to(ASSETS)),
                      "reason": "ES module <script type=\"module\">",
                      "note": "Static bundler cannot resolve module imports.",
                  })
              if DYNAMIC_IMPORT_RE.search(original):
                  unsupported.append({
                      "file": str(html_file.relative_to(ASSETS)),
                      "reason": "dynamic import() detected",
                      "note": "Runtime module resolution is unsupported.",
                  })
              if FETCH_RE.search(original):
                  unsupported.append({
                      "file": str(html_file.relative_to(ASSETS)),
                      "reason": "runtime fetch/axios/XHR detected",
                      "note": "Runtime network calls cannot be bundled.",
                  })

              # --- srcset handling -------------------------------------
              def srcset_repl(match):
                  value = match.group("dq") or match.group("sq") or ""
                  parts_out = []
                  changed = False
                  for part in value.split(","):
                      part_stripped = part.strip()
                      if not part_stripped:
                          continue
                      pieces = part_stripped.split()
                      if not pieces:
                          continue
                      candidate = pieces[0]
                      if is_external(candidate):
                          absolute = normalize_url(candidate, "")
                          local = fetch_and_store(
                              absolute,
                              referer_file=html_file,
                              base_url_for_join="",
                          )
                          if local:
                              pieces[0] = rewrite_url_to_local(
                                  candidate, local, str(html_file)
                              )
                              changed = True
                      parts_out.append(" ".join(pieces))
                  if not changed:
                      return match.group(0)
                  quote = '"' if match.group("dq") is not None else "'"
                  return "srcset=" + quote + ", ".join(parts_out) + quote

              new_html = SRCSET_RE.sub(srcset_repl, new_html)

              # --- HTML attribute URL handling --------------------------
              def attr_repl(match):
                  attr = match.group("attr")
                  raw = (
                      match.group("dq")
                      if match.group("dq") is not None
                      else (
                          match.group("sq")
                          if match.group("sq") is not None
                          else match.group("bare")
                      )
                  )
                  if not raw or not is_external(raw):
                      return match.group(0)
                  # Skip non-downloaded resources like iframe src.
                  absolute = normalize_url(raw, "")
                  local = fetch_and_store(
                      absolute,
                      referer_file=html_file,
                      base_url_for_join="",
                  )
                  if not local:
                      return match.group(0)
                  rewritten = rewrite_url_to_local(
                      raw, local, str(html_file)
                  )
                  quote = '"'
                  return '{}="{}"'.format(attr, rewritten)

              new_html = HTML_URL_ATTR_RE.sub(attr_repl, new_html)

              # --- <style> blocks --------------------------------------
              def style_block_repl(match):
                  css = match.group("css")
                  new_css, _nested = process_css_text(
                      css, html_file, ""
                  )
                  return "<style>" + new_css + "</style>"

              new_html = STYLE_BLOCK_RE.sub(
                  style_block_repl, new_html
              )

              # --- inline style="..." attributes -----------------------
              def inline_style_repl(match):
                  css = match.group("dq")
                  if css is None:
                      css = match.group("sq") or ""
                  new_css, _nested = process_css_text(
                      css, html_file, ""
                  )
                  quote = '"' if match.group("dq") is not None else "'"
                  return "style=" + quote + new_css + quote

              new_html = INLINE_STYLE_RE.sub(
                  inline_style_repl, new_html
              )

              if new_html != original:
                  try:
                      html_file.write_text(new_html, encoding="utf-8")
                  except Exception:
                      pass

          def process_css_file(css_file, visited):
              if css_file in visited:
                  return
              visited.add(css_file)
              try:
                  original = css_file.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  try:
                      original = css_file.read_text(
                          encoding="latin-1"
                      )
                  except Exception:
                      return
              except Exception:
                  return

              referer_url = ""
              new_css, nested = process_css_text(
                  original, css_file, referer_url
              )
              if new_css != original:
                  try:
                      css_file.write_text(new_css, encoding="utf-8")
                  except Exception:
                      pass

              # Recurse into downloaded CSS files (they live in
              # LOCAL_VENDOR_DIR and will be re-scanned as new CSS).
              for child in nested:
                  if child.is_file():
                      process_css_file(child, visited)

          # ============================================================
          # Walk all HTML and CSS files under assets.
          #
          # FIX 4 (integrated): Skip _offline_vendor/, _bundled/,
          # and _generated/ on the primary scan so the client-side
          # bundler output and local Tailwind CSS are not re-processed.
          # _bundled/ is still handled by recursive CSS processing
          # below so its url() refs to fonts still resolve.
          # ============================================================
          html_files = sorted(ASSETS.rglob("*.html"))
          css_files = sorted(ASSETS.rglob("*.css"))

          # Rewrite any client-side bundler output references so the
          # server-side bundler does not duplicate what the client
          # already downloaded.
          CLIENT_BUNDLED = ASSETS / "_bundled"

          for html_file in html_files:
              try:
                  rel = html_file.relative_to(ASSETS)
              except ValueError:
                  continue
              if rel.parts and rel.parts[0] in (
                  "_offline_vendor", "_bundled", "_generated"
              ):
                  continue
              try:
                  process_html_file(html_file)
              except Exception as e:
                  failed.append({
                      "url": str(html_file),
                      "reason": "html processing error: " + str(e),
                      "referer": "",
                  })

          visited_css = set()
          for css_file in css_files:
              try:
                  rel = css_file.relative_to(ASSETS)
              except ValueError:
                  continue
              if rel.parts and rel.parts[0] in (
                  "_offline_vendor", "_generated"
              ):
                  continue
              try:
                  process_css_file(css_file, visited_css)
              except Exception as e:
                  failed.append({
                      "url": str(css_file),
                      "reason": "css processing error: " + str(e),
                      "referer": "",
                  })

          # Process any client-bundled CSS files from the browser-side
          # bundler so their url() references (fonts) get downloaded
          # too. This prevents "invisible icons" caused by missing
          # .woff2 files when the client bundler succeeds but the
          # server bundler previously ignored _bundled/.
          if CLIENT_BUNDLED.is_dir():
              print("Client-side bundler output detected at _bundled/ "
                    "— including in scan.")
              for bundled_css in CLIENT_BUNDLED.glob("*.css"):
                  try:
                      process_css_file(bundled_css, visited_css)
                  except Exception as e:
                      print("WARNING: could not process bundled CSS",
                            bundled_css, e)

          # Recursive pass on newly downloaded CSS files that weren't
          # yet processed.
          for entry in list(downloaded):
              if entry.get("content_type", "").lower().startswith(
                  "text/css"
              ):
                  child = ASSETS / entry["local_path"]
                  if child.is_file() and child not in visited_css:
                      process_css_file(child, visited_css)

          # ============================================================
          # Write the report
          # ============================================================
          report = {
              "generated_at": time.strftime(
                  "%Y-%m-%dT%H:%M:%SZ", time.gmtime()
              ),
              "total_downloaded": len(downloaded),
              "total_failed": len(failed),
              "total_unsupported": len(unsupported),
              "total_downloaded_bytes": total_downloaded_bytes,
              "total_downloaded_size_mb": round(
                  total_downloaded_bytes / (1024 * 1024), 3
              ),
              "downloaded_resources": downloaded,
              "failed_resources": failed,
              "unsupported_resources": unsupported,
              "vendor_directory": str(
                  LOCAL_VENDOR_DIR.relative_to(ASSETS)
              ),
          }

          try:
              REPORT_PATH.write_text(
                  json.dumps(report, indent=2, ensure_ascii=False),
                  encoding="utf-8",
              )
          except Exception as e:
              print("WARNING: could not write report:", e)

          print("========== OFFLINE BUNDLING REPORT ==========")
          print("Downloaded:", len(downloaded))
          print("Failed:", len(failed))
          print("Unsupported:", len(unsupported))
          print("Total bytes:", total_downloaded_bytes)
          print("Report:", REPORT_PATH)
          for d in downloaded[:30]:
              print("DOWNLOADED:", d["url"], "->", d["local_path"])
          for f in failed[:30]:
              print("FAILED:", f["url"], "->", f["reason"])
          for u in unsupported[:20]:
              print("UNSUPPORTED:", u["file"], "-", u["reason"])
          print("========== OFFLINE BUNDLING END ==========")
          PY

      # ============================================================
      # FIX 3 (NEW STEP): Verify all critical offline assets made it
      # into the APK. If Tailwind CSS is missing, if the CDN script
      # is still in index.html, or if there are zero font files, the
      # build fails HERE instead of shipping a broken APK to the user.
      # ============================================================
      # ============================================================
      # Ensure Font Awesome CSS and its webfont files are packaged
      # locally. The user-supplied index.html remains unchanged in
      # the repository; only the APK assets copy is updated here.
      # ============================================================
      - name: Bundle Font Awesome CSS and Fonts Locally
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, unquote
          from urllib.request import Request, urlopen
          from html import unescape
          import re

          ASSETS = Path("myapp/app/src/main/assets")
          INDEX = ASSETS / "index.html"
          CSS_URL = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          CSS_PATH = ASSETS / "_offline_vendor/fontawesome/css/all.min.css"
          FONT_DIR = ASSETS / "_offline_vendor/fontawesome/webfonts"

          if not INDEX.is_file():
              raise SystemExit("ERROR: APK index.html is missing before Font Awesome bundling.")

          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36",
              "Accept": "text/css,*/*;q=0.8",
              "Accept-Encoding": "identity",
          }

          def download(url):
              request = Request(url, headers=headers)
              with urlopen(request, timeout=45) as response:
                  return response.read(), response.headers.get("Content-Type", "")

          print("Downloading Font Awesome 6.4.0 stylesheet...")
          try:
              css_bytes, content_type = download(CSS_URL)
          except Exception as exc:
              raise SystemExit("ERROR: Could not download Font Awesome CSS: " + str(exc))

          try:
              css_text = css_bytes.decode("utf-8")
          except UnicodeDecodeError:
              css_text = css_bytes.decode("latin-1")

          if "Font Awesome" not in css_text and "fontawesome" not in css_text.lower():
              raise SystemExit("ERROR: Downloaded stylesheet does not look like Font Awesome CSS.")

          FONT_URL_RE = re.compile(
              r"""url\(\s*(?P<quote>["']?)(?P<url>[^)'"]+)(?P=quote)\s*\)""",
              re.IGNORECASE,
          )
          allowed_exts = {".woff2", ".woff", ".ttf", ".otf", ".eot"}
          downloaded = {}

          FONT_DIR.mkdir(parents=True, exist_ok=True)
          for match in FONT_URL_RE.finditer(css_text):
              raw_url = match.group("url").strip()
              if not raw_url or raw_url.startswith("data:"):
                  continue

              absolute_url = urljoin(CSS_URL, raw_url)
              ext = Path(urlsplit(absolute_url).path).suffix.lower()
              if ext not in allowed_exts:
                  continue

              if absolute_url in downloaded:
                  continue

              filename = unquote(Path(urlsplit(absolute_url).path).name)
              if not filename:
                  continue

              try:
                  data, _mime = download(absolute_url)
                  if not data:
                      raise RuntimeError("empty response")
                  destination = FONT_DIR / filename
                  destination.write_bytes(data)
                  downloaded[absolute_url] = filename
                  print("Downloaded font:", filename, len(data), "bytes")
              except Exception as exc:
                  print("WARNING: Font download failed:", absolute_url, str(exc))

          woff2_count = sum(1 for name in downloaded.values() if name.lower().endswith(".woff2"))
          if woff2_count == 0:
              raise SystemExit(
                  "ERROR: Font Awesome stylesheet downloaded, but no .woff2 font could be saved."
              )

          def rewrite_font_url(match):
              raw_url = match.group("url").strip()
              absolute_url = urljoin(CSS_URL, raw_url)
              filename = downloaded.get(absolute_url)
              if not filename:
                  return match.group(0)
              return 'url("../webfonts/' + filename + '")'

          css_text = FONT_URL_RE.sub(rewrite_font_url, css_text)
          CSS_PATH.parent.mkdir(parents=True, exist_ok=True)
          CSS_PATH.write_text(css_text, encoding="utf-8")

          html = INDEX.read_text(encoding="utf-8")

          def replace_fontawesome_link(match):
              tag = match.group(0)
              href_match = re.search(r'\bhref\s*=\s*(["\'])(.*?)\1', tag, re.IGNORECASE)
              if not href_match:
                  return tag

              href = unescape(href_match.group(2))
              is_fa_link = "font-awesome" in href.lower() or "fontawesome" in href.lower()

              # Also recognize a CSS file that the earlier offline bundler
              # already downloaded and rewrote to a local path.
              if not is_fa_link and not href.lower().startswith(("http://", "https://", "data:")):
                  candidate = (ASSETS / href).resolve()
                  try:
                      if candidate.is_file():
                          existing_css = candidate.read_text(encoding="utf-8", errors="ignore")
                          is_fa_link = "Font Awesome" in existing_css or "fontawesome" in existing_css.lower()
                  except Exception:
                      pass

              if not is_fa_link:
                  return tag

              return (
                  tag[:href_match.start(2)]
                  + "_offline_vendor/fontawesome/css/all.min.css"
                  + tag[href_match.end(2):]
              )

          link_tag_re = re.compile(r"<link\b[^>]*>", re.IGNORECASE)
          html, replaced_links = link_tag_re.subn(replace_fontawesome_link, html)

          if replaced_links == 0:
              local_link = '<link rel="stylesheet" href="_offline_vendor/fontawesome/css/all.min.css">'
              if re.search(r"</head\s*>", html, re.IGNORECASE):
                  html = re.sub(r"</head\s*>", local_link + "\n</head>", html, count=1, flags=re.IGNORECASE)
              else:
                  html = local_link + "\n" + html

          INDEX.write_text(html, encoding="utf-8")

          saved_fonts = list(FONT_DIR.glob("*"))
          print("Font Awesome stylesheet:", CSS_PATH)
          print("Font Awesome local font files:", len(saved_fonts))
          print("Font Awesome links updated:", replaced_links)
          print("SUCCESS: Font Awesome CSS and WOFF2 fonts are packaged locally.")
          PY

      - name: Verify Critical Offline Assets
        run: |
          set -euo pipefail
          ASSETS="myapp/app/src/main/assets"

          echo "=== Tailwind CSS ==="
          if [ ! -s "$ASSETS/_generated/tailwind.css" ]; then
            echo "ERROR: _generated/tailwind.css is missing or empty."
            echo "Offline design will be broken. Aborting build."
            exit 1
          fi
          wc -c "$ASSETS/_generated/tailwind.css"

          echo "=== Tailwind CDN removed from APK index.html ==="
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("myapp/app/src/main/assets/index.html").read_text(encoding="utf-8")
          pattern = re.compile(
              r'<script\b(?=[^>]*\bsrc\s*=\s*["\']https://cdn\.tailwindcss\.com(?:/[^"\']*)?(?:\?[^"\']*)?["\'])[^>]*>.*?</script\s*>',
              re.IGNORECASE | re.DOTALL,
          )
          if pattern.search(html):
              raise SystemExit(
                  "ERROR: Tailwind CDN script still present in APK index.html. "
                  "Offline build will be broken."
              )
          print("Tailwind CDN script removed: OK")
          PY

          echo "=== Font files (.woff2 / .woff / .ttf) ==="
          WOFF_COUNT=$(find "$ASSETS" \( -name "*.woff2" -o -name "*.woff" -o -name "*.ttf" \) 2>/dev/null | wc -l)
          echo "Font files found: $WOFF_COUNT"
          if [ "$WOFF_COUNT" -lt 1 ]; then
            echo "ERROR: No font files in APK assets — icons will be invisible."
            echo "Check that _bundled/ or _offline_vendor/ contains font files."
            echo "Aborting build."
            exit 1
          fi

          echo "=== Font Awesome CSS sanity check ==="
          FA_CSS=$(find "$ASSETS" -name "*.css" 2>/dev/null | xargs grep -l "font-family.*Font Awesome" 2>/dev/null | head -1 || true)
          if [ -z "$FA_CSS" ]; then
            echo "WARNING: No Font Awesome CSS detected in APK assets."
            echo "Icons may still be visible if CSS is inlined, but check the report."
          else
            echo "Font Awesome CSS: $FA_CSS"
          fi

          echo "=== All local asset references in index.html ==="
          grep -oE '(src|href)="[^"]*"' "$ASSETS/index.html" | grep -vE '^(src|href)="https?://' | head -20 || true

          echo "ALL CRITICAL OFFLINE ASSETS VERIFIED."

      # ============================================================
      # INLINE TAILWIND CSS INTO THE APK HTML
      # This avoids WebView local stylesheet URL/loading problems.
      # Only the APK copy under myapp/assets is changed; source HTML
      # in the uploaded project / online site remains untouched.
      # ============================================================
      - name: Inline Tailwind CSS for Android WebView
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          assets = Path("myapp/app/src/main/assets")
          index = assets / "index.html"
          css_file = assets / "_generated/tailwind.css"

          if not index.is_file():
              raise SystemExit("ERROR: APK index.html is missing before CSS inlining.")
          # Minified Tailwind CSS may validly be below 10 KB; reject only missing or empty output.
          if not css_file.is_file() or css_file.stat().st_size == 0:
              raise SystemExit("ERROR: Generated Tailwind CSS is missing or unexpectedly small.")

          html = index.read_text(encoding="utf-8")
          css = css_file.read_text(encoding="utf-8")

          # Do not require fixed utility selectors: a valid project may not use
          # every example class (for example, h-screen or items-center).
          # Tailwind's content scanner generates only utilities actually found
          # in the project's HTML/JS source.
          if not css.strip():
              raise SystemExit("ERROR: Tailwind generated an empty stylesheet.")

          # Remove the external/local Tailwind stylesheet references from
          # the APK copy. The complete CSS is embedded directly below.
          html = re.sub(
              r'<link\b(?=[^>]*\bhref\s*=\s*["\'](?:_generated/)?tailwind\.css["\'])[^>]*>',
              '', html, flags=re.IGNORECASE
          )

          style_tag = '<style id="webappstudio-tailwind-offline">\n' + css + '\n</style>'
          if 'id="webappstudio-tailwind-offline"' in html:
              html = re.sub(
                  r'<style\b[^>]*id=["\']webappstudio-tailwind-offline["\'][^>]*>.*?</style\s*>',
                  lambda _m: style_tag,
                  html,
                  count=1,
                  flags=re.IGNORECASE | re.DOTALL
              )
          elif re.search(r'</head\s*>', html, re.IGNORECASE):
              html = re.sub(r'</head\s*>', lambda _m: style_tag + '\n</head>', html, count=1, flags=re.IGNORECASE)
          else:
              raise SystemExit("ERROR: </head> not found; cannot inline Tailwind CSS safely.")

          index.write_text(html, encoding="utf-8")
          print("SUCCESS: Tailwind CSS inlined into APK index.html.")
          print("Inline CSS bytes:", len(css.encode("utf-8")))
          print("Tailwind stylesheet is non-empty; fixed example-selector checks skipped.")
          PYCODE


