name: Build Real APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (Caching Disabled)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true
          cache-enabled: false

      - name: Create Minimal Android App Structure
        run: |
          mkdir -p myapp/app/src/main/assets
          mkdir -p myapp/app/src/main/java/com/app/builder
          mkdir -p myapp/app/src/main/res

          # Android Manifest
          cat << 'EOF' > myapp/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.app.builder">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="${{ github.event.client_payload.appName }}"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity with WebView
          cat << 'EOF' > myapp/app/src/main/java/com/app/builder/MainActivity.java
          package com.app.builder;
          import android.os.Bundle;
          import android.webkit.WebView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

          # Gradle Settings
          echo "include ':app'" > myapp/settings.gradle

          # App build.gradle
          cat << 'EOF' > myapp/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              compileSdk 33
              defaultConfig {
                  applicationId "com.app.builder"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # Root build.gradle
          cat << 'EOF' > myapp/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # Sample index.html inside assets
          echo "<!DOCTYPE html><html><head><title>App</title></head><body style='background:#111;color:white;text-align:center;padding-top:50px;'><h1>Hello from Cloud App!</h1></body></html>" > myapp/app/src/main/assets/index.html

          # Initialize gradle wrapper so gradlew is created successfully
          cd myapp
          gradle wrapper --gradle-version 7.5

      - name: Build APK with Gradle Wrapper
        working-directory: ./myapp
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-working-apk
          path: myapp/app/build/outputs/apk/debug/app-debug.apk
