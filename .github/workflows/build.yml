              private void loadAppOpen() {
                  if (appOpenId.isEmpty()) return;

                  AppOpenAd.load(
                      activity,
                      appOpenId,
                      new AdRequest.Builder().build(),
                      new AppOpenAdLoadCallback() {
                          @Override
                          public void onAdLoaded(AppOpenAd ad) {
                              appOpenAd = ad;

                              if (!appOpenShown) {
                                  appOpenShown = true;
                                  showAppOpenInternal();
                              }
                          }

                          @Override
                          public void onAdFailedToLoad(LoadAdError error) {
                              appOpenAd = null;
                          }
                      }
                  );
              }

              private void showAppOpenInternal() {
                  if (appOpenAd == null) {
                      loadAppOpen();
                      return;
                  }

                  appOpenAd.setFullScreenContentCallback(
                      new FullScreenContentCallback() {
                          @Override
                          public void onAdDismissedFullScreenContent() {
                              appOpenAd = null;
                              loadAppOpen();
                          }

                          @Override
                          public void onAdFailedToShowFullScreenContent(
                                  com.google.android.gms.ads.AdError error) {
                              appOpenAd = null;
                              loadAppOpen();
                          }
                      }
                  );

                  appOpenAd.show(activity);
              }

              @JavascriptInterface
              public void showAppOpen() {
                  activity.runOnUiThread(this::showAppOpenInternal);
              }
          }
          '''

          bridge_code = bridge_code.replace("PACKAGE_NAME", package_name)

          bridge_file = java_dir / "AdMobBridge.java"
          bridge_file.write_text(bridge_code, encoding="utf-8")

          print("AdMob Java bridge created.")
          print("AdMob App ID configured.")
          print("AdMob enabled for this build.")
          PY

          # Add Google Mobile Ads SDK dependency only for enabled builds.
          if ! grep -q "play-services-ads" myapp/app/build.gradle; then
            cat >> myapp/app/build.gradle <<'EOF'

          dependencies {
              implementation 'com.google.android.gms:play-services-ads:23.2.0'
          }
          EOF
          fi

          echo "AdMob SDK and Java bridge configured."

      # ============================================================
      # Verify AdMob configuration only if AdMob is enabled.
      # ============================================================
      - name: Verify New AdMob Integration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="myapp/app/src/main/assets/admob.config.json"

          if [ ! -f "$CONFIG" ]; then
            echo "AdMob is not configured. Skipping verification."
            exit 0
          fi

          ENABLED=$(python3 -c "import json; print(str(json.load(open('$CONFIG')).get('enabled', False)).lower())")

          if [ "$ENABLED" != "true" ]; then
            echo "AdMob disabled. Skipping verification."
            exit 0
          fi

          grep -q "play-services-ads" myapp/app/build.gradle
          grep -q "AdMobBridge" myapp/app/src/main/java/*/*/*/AdMobBridge.java 2>/dev/null || \
          find myapp/app/src/main/java -name "AdMobBridge.java" | grep -q .

          grep -q "com.google.android.gms.ads.APPLICATION_ID" \
            myapp/app/src/main/AndroidManifest.xml

          echo "AdMob integration verification passed."

      # ============================================================
      # Verify launcher icons AFTER AdMob manifest modification.
      # ============================================================
      - name: Verify Final Android Launcher Icons
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          android_ns = "http://schemas.android.com/apk/res/android"
          manifest_path = Path("myapp/app/src/main/AndroidManifest.xml")

          if not manifest_path.is_file():
              raise SystemExit("ERROR: AndroidManifest.xml not found.")

          tree = ET.parse(manifest_path)
          application = tree.getroot().find("application")

          if application is None:
              raise SystemExit("ERROR: Application element not found.")

          icon = application.get(f"{{{android_ns}}}icon")
          round_icon = application.get(f"{{{android_ns}}}roundIcon")

          print("Manifest icon:", icon)
          print("Manifest roundIcon:", round_icon)

          if icon == "@mipmap/ic_launcher":
              if round_icon != "@mipmap/ic_launcher":
                  raise SystemExit("ERROR: roundIcon is not configured.")

              folders = [
                  "mipmap-mdpi",
                  "mipmap-hdpi",
                  "mipmap-xhdpi",
                  "mipmap-xxhdpi",
                  "mipmap-xxxhdpi"
              ]

              for folder in folders:
                  icon_file = (
                      Path("myapp/app/src/main/res")
                      / folder
                      / "ic_launcher.png"
                  )

                  if not icon_file.is_file():
                      raise SystemExit(
                          "ERROR: Missing launcher icon: " + str(icon_file)
                      )

                  if icon_file.stat().st_size == 0:
                      raise SystemExit(
                          "ERROR: Empty launcher icon: " + str(icon_file)
                      )

                  print("VERIFIED:", icon_file)

              print("CUSTOM LAUNCHER ICON VERIFICATION PASSED.")

          else:
              print(
                  "No custom icon configured. "
                  "This build will use the Android default icon."
              )
          PY

      # ============================================================
