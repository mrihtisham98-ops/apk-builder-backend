name: Build Real APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        run: |
          # Create Android Project Structure
          mkdir -p myapp/app/src/main/assets
          mkdir -p myapp/app/src/main/java/com/app/builder
          mkdir -p myapp/app/src/main/res/values

          # Android Manifest
          cat << 'EOF' > myapp/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.app.builder">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="${{ github.event.client_payload.appName }}"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity with WebView
          cat << 'EOF' > myapp/app/src/main/java/com/app/builder/MainActivity.java
          package com.app.builder;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.app.Activity;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

          # Gradle Settings
          echo "include ':app'" > myapp/settings.gradle

          # App build.gradle
          cat << 'EOF' > myapp/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              compileSdk 34
              namespace 'com.app.builder'
              defaultConfig {
                  applicationId "com.app.builder"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # Root build.gradle
          cat << 'EOF' > myapp/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # Set local.properties to runner's built-in SDK path
          echo "sdk.dir=$ANDROID_HOME" > myapp/local.properties

          # App Asset File
          echo "<!DOCTYPE html><html><head><title>App</title></head><body style='background:#111;color:white;text-align:center;padding-top:50px;'><h1>Cloud Build Successful!</h1></body></html>" > myapp/app/src/main/assets/index.html

          # Generate Gradle Wrapper & Build APK
          cd myapp
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-working-apk
          path: myapp/app/build/outputs/apk/debug/app-debug.apk
