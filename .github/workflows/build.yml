name: Build Real APK

run-name: Build APK ${{ github.event.client_payload.buildId }}

on:
  repository_dispatch:
    types: [build_apk]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Temporary Build Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref }}
          path: source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Python Image and Offline Bundling Support
        run: |
          python3 -m pip install --upgrade pip
          pip install Pillow requests beautifulsoup4 tinycss2

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Read Build Configuration and Copy Project
        env:
          BUILD_ID: ${{ github.event.client_payload.buildId }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from PIL import Image, ImageOps

          build_id = os.environ["BUILD_ID"]
          source = Path("source/.build-input") / build_id
          config_file = source / "build-config.json"
          project = source / "project"

          if not config_file.is_file():
              raise SystemExit("ERROR: build-config.json not found.")

          config = json.loads(config_file.read_text(encoding="utf-8"))

          app_name = config.get("appName", "My Web App")
          package_name = config.get("packageName", "")
          icon_path = config.get("iconPath")

          if not re.fullmatch(
              r"[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+",
              package_name
          ):
              raise SystemExit("ERROR: Invalid package name.")

          if not (project / "index.html").is_file():
              raise SystemExit("ERROR: Root index.html is missing.")

          root = Path("myapp")
          assets = root / "app/src/main/assets"
          java_dir = root / "app/src/main/java" / Path(*package_name.split("."))

          assets.mkdir(parents=True, exist_ok=True)
          java_dir.mkdir(parents=True, exist_ok=True)

          shutil.copytree(project, assets, dirs_exist_ok=True)

          # Verify copied HTML project assets
          all_files = [p for p in assets.rglob("*") if p.is_file()]
          total_size = sum(p.stat().st_size for p in all_files)

          print("========== ASSET VERIFICATION ==========")
          print("Total files copied:", len(all_files))
          print("Total asset size:", round(total_size / (1024 * 1024), 2), "MB")
          print("Index HTML exists:", (assets / "index.html").is_file())

          for file in all_files[:50]:
              print("ASSET:", file.relative_to(assets))

          print("========================================")

          # Create Android manifest.
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)

          manifest = ET.Element("manifest")
          manifest.set("package", package_name)

          permission = ET.SubElement(manifest, "uses-permission")
          permission.set(
              f"{{{android_ns}}}name",
              "android.permission.INTERNET"
          )

          application = ET.SubElement(manifest, "application")
          application.set(f"{{{android_ns}}}label", app_name)
          application.set(
              f"{{{android_ns}}}theme",
              "@android:style/Theme.Material.Light.NoActionBar"
          )
          application.set(
              f"{{{android_ns}}}usesCleartextTraffic",
              "true"
          )

          activity = ET.SubElement(application, "activity")
          activity.set(
              f"{{{android_ns}}}name",
              ".MainActivity"
          )
          activity.set(
              f"{{{android_ns}}}exported",
              "true"
          )

          intent = ET.SubElement(activity, "intent-filter")
          action = ET.SubElement(intent, "action")
          action.set(
              f"{{{android_ns}}}name",
              "android.intent.action.MAIN"
          )

          category = ET.SubElement(intent, "category")
          category.set(
              f"{{{android_ns}}}name",
              "android.intent.category.LAUNCHER"
          )

          manifest_path = root / "app/src/main/AndroidManifest.xml"
          manifest_path.parent.mkdir(parents=True, exist_ok=True)

          # =====================================================
          # CUSTOM APP ICON FIX
          # Locate the uploaded image and create Android icons.
          # =====================================================

          print("========== APP ICON DETECTION ==========")
          print("Configured iconPath:", repr(icon_path))

          supported_extensions = {
              ".png", ".jpg", ".jpeg", ".webp"
          }

          icon_file = None

          # 1. First try the exact iconPath from build-config.json.
          if icon_path and isinstance(icon_path, str):
              configured_file = (source / icon_path).resolve()
              source_resolved = source.resolve()

              try:
                  configured_file.relative_to(source_resolved)
              except ValueError:
                  raise SystemExit(
                      "ERROR: Icon path is outside build directory."
                  )

              if configured_file.is_file():
                  icon_file = configured_file
                  print("Icon found using iconPath:", icon_file)

              else:
                  print("Configured iconPath file not found.")

          # 2. Search common icon filenames if iconPath is missing.
          if icon_file is None:
              preferred_names = [
                  "app-icon.png",
                  "app-icon.jpg",
                  "app-icon.jpeg",
                  "app-icon.webp",
                  "app_icon.png",
                  "app_icon.jpg",
                  "icon.png",
                  "icon.jpg",
                  "icon.jpeg",
                  "icon.webp",
                  "launcher.png",
                  "launcher.jpg",
                  "launcher.webp"
              ]

              for filename in preferred_names:
                  candidate = source / filename

                  if candidate.is_file():
                      icon_file = candidate
                      print("Icon found using filename:", candidate)
                      break

          # 3. Search uploaded image files outside the project folder.
          if icon_file is None:
              image_candidates = []

              for candidate in source.rglob("*"):
                  if not candidate.is_file():
                      continue

                  if "project" in candidate.relative_to(source).parts:
                      continue

                  if candidate.name == "build-config.json":
                      continue

                  if candidate.suffix.lower() in supported_extensions:
                      image_candidates.append(candidate)

              named_candidates = [
                  item for item in image_candidates
                  if "icon" in item.stem.lower()
                  or "launcher" in item.stem.lower()
                  or "logo" in item.stem.lower()
              ]

              if len(named_candidates) == 1:
                  icon_file = named_candidates[0]

              elif len(image_candidates) == 1:
                  icon_file = image_candidates[0]

              elif len(named_candidates) > 1:
                  raise SystemExit(
                      "ERROR: Multiple possible icon images found. "
                      "Please provide a clear iconPath in build-config.json."
                  )

              elif len(image_candidates) > 1:
                  raise SystemExit(
                      "ERROR: Multiple images found and no clear app icon "
                      "could be identified."
                  )

          icon_enabled = False

          if icon_file is not None:
              print("SELECTED ICON:", icon_file)
              print("ICON EXISTS:", icon_file.is_file())

              try:
                  with Image.open(icon_file) as original:
                      original.load()
                      image = ImageOps.exif_transpose(original).convert("RGBA")

                  if image.width < 1 or image.height < 1:
                      raise ValueError("Invalid image dimensions.")

                  print(
                      "Original icon dimensions:",
                      image.width,
                      "x",
                      image.height
                  )

                  # Make a square transparent launcher image.
                  # This preserves the complete uploaded image.
                  for folder, size in [
                      ("mipmap-mdpi", 48),
                      ("mipmap-hdpi", 72),
                      ("mipmap-xhdpi", 96),
                      ("mipmap-xxhdpi", 144),
                      ("mipmap-xxxhdpi", 192)
                  ]:
                      target = root / "app/src/main/res" / folder
                      target.mkdir(parents=True, exist_ok=True)

                      resized = ImageOps.contain(
                          image,
                          (size, size),
                          method=Image.Resampling.LANCZOS
                      )

                      canvas = Image.new(
                          "RGBA",
                          (size, size),
                          (0, 0, 0, 0)
                      )

                      x = (size - resized.width) // 2
                      y = (size - resized.height) // 2

                      canvas.alpha_composite(resized, (x, y))

                      output_file = target / "ic_launcher.png"
                      canvas.save(output_file, format="PNG")

                      print(
                          "CREATED ICON:",
                          output_file,
                          output_file.stat().st_size,
                          "bytes"
                      )

                  # Set both standard and round launcher icons.
                  application.set(
                      f"{{{android_ns}}}icon",
                      "@mipmap/ic_launcher"
                  )

                  application.set(
                      f"{{{android_ns}}}roundIcon",
                      "@mipmap/ic_launcher"
                  )

                  icon_enabled = True

                  print("CUSTOM ICON GENERATED SUCCESSFULLY.")

              except Exception as error:
                  raise SystemExit(
                      "ERROR: Could not process uploaded app icon: "
                      + str(error)
                  )

          else:
              if icon_path:
                  raise SystemExit(
                      "ERROR: iconPath was provided but no valid icon "
                      "image was found."
                  )

              print(
                  "WARNING: No custom icon was uploaded. "
                  "Android default icon will be used."
              )

          # Write the final manifest after setting icon attributes.
          ET.ElementTree(manifest).write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True
          )

          # Verify generated launcher icons.
          if icon_enabled:
              for folder in [
                  "mipmap-mdpi",
                  "mipmap-hdpi",
                  "mipmap-xhdpi",
                  "mipmap-xxhdpi",
                  "mipmap-xxxhdpi"
              ]:
                  generated = (
                      root / "app/src/main/res" / folder / "ic_launcher.png"
                  )

                  if not generated.is_file() or generated.stat().st_size == 0:
                      raise SystemExit(
                          "ERROR: Launcher icon missing: " + str(generated)
                      )

              check_tree = ET.parse(manifest_path)
              check_application = check_tree.getroot().find("application")

              if check_application is None:
                  raise SystemExit("ERROR: Application element missing.")

              if check_application.get(
                  f"{{{android_ns}}}icon"
              ) != "@mipmap/ic_launcher":
                  raise SystemExit("ERROR: android:icon was not configured.")

              if check_application.get(
                  f"{{{android_ns}}}roundIcon"
              ) != "@mipmap/ic_launcher":
                  raise SystemExit(
                      "ERROR: android:roundIcon was not configured."
                  )

              print("LAUNCHER ICON VERIFICATION PASSED.")

          # Create MainActivity with Android WebView file picker support.
          java_code = f'''package {package_name};

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.ValueCallback;
          import android.content.ActivityNotFoundException;

          public class MainActivity extends Activity {{
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {{
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {{

                          if (MainActivity.this.filePathCallback != null) {{
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                              MainActivity.this.filePathCallback = null;
                          }}

                          MainActivity.this.filePathCallback = filePathCallback;

                          try {{
                              Intent intent = fileChooserParams.createIntent();
                              startActivityForResult(
                                  intent,
                                  FILE_CHOOSER_REQUEST_CODE
                              );
                              return true;
                          }} catch (ActivityNotFoundException exception) {{
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }}
                      }}
                  }});

                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }}

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {{
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {{
                      if (filePathCallback == null) {{
                          return;
                      }}

                      Uri[] results = null;

                      if (resultCode == Activity.RESULT_OK && data != null) {{
                          results = WebChromeClient.FileChooserParams.parseResult(
                              resultCode,
                              data
                          );
                      }}

                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }}
              }}

              @Override
              public void onBackPressed() {{
                  if (webView != null && webView.canGoBack()) {{
                      webView.goBack();
                  }} else {{
                      super.onBackPressed();
                  }}
              }}
          }}
          '''

          (java_dir / "MainActivity.java").write_text(
              java_code,
              encoding="utf-8"
          )

          print("Project files copied successfully.")
          print("App:", app_name)
          print("Package:", package_name)
          print("Custom icon enabled:", icon_enabled)
          PY

      # ============================================================
      # OFFLINE DEPENDENCY BUNDLER
      # Downloads common external CSS, JS, fonts and images into APK.
      # ============================================================
      - name: Bundle External Dependencies for Offline APK
        run: |
          python3 - <<'PY'
          import re
          import json
          import hashlib
          import mimetypes
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, unquote
          import requests
          from bs4 import BeautifulSoup

          assets = Path("myapp/app/src/main/assets")
          offline = assets / "offline-deps"
          offline.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 OfflineAPKBuilder/1.0"
          })

          downloaded = {}
          failures = []
          total_bytes = 0
          MAX_FILE_SIZE = 25 * 1024 * 1024
          TIMEOUT = 25

          def is_remote(value):
              return value.startswith(("http://", "https://"))

          def clean_url(value):
              value = value.strip().strip("'\"")
              if not value or value.startswith((
                  "data:", "blob:", "javascript:", "mailto:",
                  "tel:", "#", "file:"
              )):
                  return None
              return value

          def download_url(url, kind="asset"):
              global total_bytes

              url = clean_url(url)
              if not url or not is_remote(url):
                  return None

              if url in downloaded:
                  return downloaded[url]

              try:
                  response = session.get(
                      url,
                      timeout=TIMEOUT,
                      stream=True,
                      allow_redirects=True
                  )
                  response.raise_for_status()

                  content_length = response.headers.get("content-length")
                  if content_length and int(content_length) > MAX_FILE_SIZE:
                      raise ValueError("File exceeds 25 MB limit")

                  content = bytearray()
                  for chunk in response.iter_content(64 * 1024):
                      if not chunk:
                          continue
                      content.extend(chunk)
                      if len(content) > MAX_FILE_SIZE:
                          raise ValueError("File exceeds 25 MB limit")

                  if not content:
                      raise ValueError("Downloaded file is empty")

                  final_url = response.url
                  content_type = response.headers.get(
                      "content-type", ""
                  ).split(";")[0].strip().lower()

                  parsed = urlparse(final_url)
                  suffix = Path(unquote(parsed.path)).suffix.lower()

                  if not suffix or len(suffix) > 8:
                      guessed = mimetypes.guess_extension(content_type)
                      suffix = guessed or ".bin"

                  digest = hashlib.sha256(
                      (final_url + str(len(content))).encode("utf-8")
                      + bytes(content[:256])
                  ).hexdigest()[:20]

                  filename = digest + suffix
                  target = offline / filename
                  target.write_bytes(content)

                  local_path = "offline-deps/" + filename
                  downloaded[url] = local_path
                  downloaded[final_url] = local_path
                  total_bytes += len(content)

                  print(
                      "DOWNLOADED:",
                      kind,
                      url,
                      "->",
                      local_path,
                      "(",
                      len(content),
                      "bytes )"
                  )

                  return local_path

              except Exception as error:
                  failures.append({
                      "url": url,
                      "type": kind,
                      "error": str(error)
                  })
                  print("DOWNLOAD WARNING:", url, str(error))
                  return None

          css_url_pattern = re.compile(
              r"url\(\s*(['\"]?)(.*?)\1\s*\)",
              re.IGNORECASE
          )

          import_pattern = re.compile(
              r"@import\s+(?:url\(\s*)?(['\"])(.*?)\1\s*\)?([^;]*);",
              re.IGNORECASE
          )

          def process_css(css_text, base_url, depth=0):
              if depth > 5:
                  return css_text

              def replace_import(match):
                  original_url = match.group(2).strip()
                  absolute = urljoin(base_url, original_url)

                  local = download_url(absolute, "css-import")
                  if not local:
                      return match.group(0)

                  try:
                      response = session.get(absolute, timeout=TIMEOUT)
                      response.raise_for_status()
                      nested_css = process_css(
                          response.text,
                          response.url,
                          depth + 1
                      )
                      (assets / local).write_text(
                          nested_css,
                          encoding="utf-8"
                      )
                  except Exception as error:
                      failures.append({
                          "url": absolute,
                          "type": "css-import-processing",
                          "error": str(error)
                      })

                  return '@import url("' + local + '")' + match.group(3) + ';'

              css_text = import_pattern.sub(replace_import, css_text)

              def replace_css_url(match):
                  original_url = match.group(2).strip()
                  if not original_url:
                      return match.group(0)

                  absolute = urljoin(base_url, original_url)
                  local = download_url(absolute, "css-resource")

                  if local:
                      return 'url("' + local + '")'

                  return match.group(0)

              css_text = css_url_pattern.sub(replace_css_url, css_text)
              return css_text

          html_files = list(assets.rglob("*.html"))
          css_files = list(assets.rglob("*.css"))

          print("HTML files found:", len(html_files))
          print("CSS files found:", len(css_files))

          # Process existing local CSS files.
          for css_file in css_files:
              try:
                  original_css = css_file.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )
                  processed_css = process_css(
                      original_css,
                      "https://offline.invalid/"
                  )
                  css_file.write_text(
                      processed_css,
                      encoding="utf-8"
                  )
              except Exception as error:
                  failures.append({
                      "file": str(css_file),
                      "type": "local-css",
                      "error": str(error)
                  })

          # Process every HTML page in the project.
          for html_file in html_files:
              print("PROCESSING HTML:", html_file.relative_to(assets))

              html_text = html_file.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              soup = BeautifulSoup(html_text, "html.parser")

              # External stylesheet links.
              for tag in soup.find_all("link", href=True):
                  rel = tag.get("rel", [])
                  rel_text = " ".join(rel).lower() if isinstance(
                      rel, list
                  ) else str(rel).lower()

                  href = tag.get("href", "").strip()

                  if "stylesheet" in rel_text and is_remote(href):
                      local = download_url(href, "stylesheet")

                      if local:
                          try:
                              response = session.get(
                                  href,
                                  timeout=TIMEOUT
                              )
                              response.raise_for_status()
                              css = process_css(
                                  response.text,
                                  response.url
                              )
                              (assets / local).write_text(
                                  css,
                                  encoding="utf-8"
                              )
                          except Exception as error:
                              failures.append({
                                  "url": href,
                                  "type": "stylesheet-processing",
                                  "error": str(error)
                              })

                          tag["href"] = local

                  elif is_remote(href) and rel_text in (
                      "icon", "shortcut icon", "apple-touch-icon"
                  ):
                      local = download_url(href, "html-icon")
                      if local:
                          tag["href"] = local

              # External JavaScript files.
              for tag in soup.find_all("script", src=True):
                  src = tag.get("src", "").strip()

                  if is_remote(src):
                      local = download_url(src, "javascript")
                      if local:
                          tag["src"] = local

              # Images, video posters and audio/video sources.
              for tag in soup.find_all(True):
                  for attribute in ("src", "poster"):
                      value = tag.get(attribute)

                      if value and is_remote(str(value).strip()):
                          local = download_url(
                              str(value).strip(),
                              "html-" + attribute
                          )
                          if local:
                              tag[attribute] = local

                  # Inline style attributes.
                  style = tag.get("style")
                  if style:
                      tag["style"] = process_css(
                          style,
                          "https://offline.invalid/"
                      )

              # CSS inside <style> blocks.
              for style_tag in soup.find_all("style"):
                  if style_tag.string:
                      style_tag.string.replace_with(
                          process_css(
                              str(style_tag.string),
                              "https://offline.invalid/"
                          )
                      )

              # Rewrite srcset entries when possible.
              for tag in soup.find_all(srcset=True):
                  entries = []
                  for item in tag.get("srcset", "").split(","):
                      parts = item.strip().split()
                      if not parts:
                          continue

                      candidate = parts[0]
                      if is_remote(candidate):
                          local = download_url(candidate, "srcset")
                          if local:
                              parts[0] = local

                      entries.append(" ".join(parts))

                  tag["srcset"] = ", ".join(entries)

              html_file.write_text(
                  str(soup),
                  encoding="utf-8"
              )

          report = {
              "status": "completed",
              "html_files_processed": len(html_files),
              "css_files_processed": len(css_files),
              "resources_downloaded": len(downloaded),
              "downloaded_size_bytes": total_bytes,
              "downloaded_size_mb": round(
                  total_bytes / (1024 * 1024), 2
              ),
              "failed_resources": failures,
              "limitations": [
                  "JavaScript dynamic imports and runtime-created URLs "
                  "are not automatically rewritten.",
                  "Remote APIs, databases, authentication, streaming and "
                  "server features still require internet.",
                  "Some CDN packages may depend on additional runtime "
                  "resources that this bundler cannot detect."
              ]
          }

          report_file = assets / "offline-bundling-report.json"
          report_file.write_text(
              json.dumps(report, indent=2),
              encoding="utf-8"
          )

          print("========== OFFLINE BUNDLING SUMMARY ==========")
          print("Resources downloaded:", len(downloaded))
          print("Downloaded MB:", report["downloaded_size_mb"])
          print("Failed resources:", len(failures))
          print("Report:", report_file)
          print("==============================================")

          PY
      - name: Create Gradle Project
        working-directory: myapp
        run: |
          mkdir -p app/src/main/java/${PACKAGE_NAME//./\/}
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MyApp"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace System.getenv("PACKAGE_NAME")
              compileSdk 34

              defaultConfig {
                  applicationId System.getenv("PACKAGE_NAME")
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Verify AndroidX Configuration
        working-directory: myapp
        run: |
          if ! grep -q "android.useAndroidX=true" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi
          if ! grep -q "android.enableJetifier=true" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi

      - name: Build APK
        working-directory: myapp
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../release
          cp app/build/outputs/apk/debug/app-debug.apk ../release/app-${BUILD_ID}.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.event.client_payload.buildId }}
          name: APK Build ${{ github.event.client_payload.buildId }}
          files: release/app-${{ github.event.client_payload.buildId }}.apk
          fail_on_unmatched_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Temporary Build Branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_REF="${{ github.event.client_payload.ref }}"
          if [[ "$BUILD_REF" == source/.build-input/* ]]; then
            git push origin --delete "$BUILD_REF" || true
          fi
