name: Build Real APK

run-name: Build APK ${{ github.event.client_payload.buildId }}

on:
  repository_dispatch:
    types: [build_apk]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Temporary Build Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref }}
          path: source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Python Image Support
        run: pip install Pillow

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Read Build Configuration and Copy Project
        env:
          BUILD_ID: ${{ github.event.client_payload.buildId }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          build_id = os.environ["BUILD_ID"]
          source = Path("source/.build-input") / build_id
          config_file = source / "build-config.json"
          project = source / "project"

          if not config_file.is_file():
              raise SystemExit("ERROR: build-config.json not found.")

          config = json.loads(config_file.read_text(encoding="utf-8"))

          app_name = config.get("appName", "My Web App")
          package_name = config.get("packageName", "")
          icon_path = config.get("iconPath")

          if not re.fullmatch(
              r"[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+",
              package_name
          ):
              raise SystemExit("ERROR: Invalid package name.")

          if not (project / "index.html").is_file():
              raise SystemExit("ERROR: Root index.html is missing.")

          root = Path("myapp")
          assets = root / "app/src/main/assets"
          java_dir = root / "app/src/main/java" / Path(*package_name.split("."))

          assets.mkdir(parents=True, exist_ok=True)
          java_dir.mkdir(parents=True, exist_ok=True)

          shutil.copytree(project, assets, dirs_exist_ok=True)

          # Verify copied HTML project assets
          all_files = [p for p in assets.rglob("*") if p.is_file()]
          total_size = sum(p.stat().st_size for p in all_files)

          print("========== ASSET VERIFICATION ==========")
          print("Total files copied:", len(all_files))
          print("Total asset size:", round(total_size / (1024 * 1024), 2), "MB")
          print("Index HTML exists:", (assets / "index.html").is_file())

          for file in all_files[:50]:
              print("ASSET:", file.relative_to(assets))

          print("========================================")

          # Create Android manifest.
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)

          manifest = ET.Element("manifest")
          manifest.set("package", package_name)

          permission = ET.SubElement(manifest, "uses-permission")
          permission.set(
              f"{{{android_ns}}}name",
              "android.permission.INTERNET"
          )

          application = ET.SubElement(manifest, "application")
          application.set(f"{{{android_ns}}}label", app_name)
          application.set(
              f"{{{android_ns}}}theme",
              "@android:style/Theme.Material.Light.NoActionBar"
          )
          application.set(
              f"{{{android_ns}}}usesCleartextTraffic",
              "true"
          )

          activity = ET.SubElement(application, "activity")
          activity.set(
              f"{{{android_ns}}}name",
              ".MainActivity"
          )
          activity.set(
              f"{{{android_ns}}}exported",
              "true"
          )

          intent = ET.SubElement(activity, "intent-filter")
          action = ET.SubElement(intent, "action")
          action.set(
              f"{{{android_ns}}}name",
              "android.intent.action.MAIN"
          )

          category = ET.SubElement(intent, "category")
          category.set(
              f"{{{android_ns}}}name",
              "android.intent.category.LAUNCHER"
          )

          manifest_path = root / "app/src/main/AndroidManifest.xml"
          manifest_path.parent.mkdir(parents=True, exist_ok=True)
          ET.ElementTree(manifest).write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True
          )

          # Create MainActivity with Android WebView file picker support.
          java_code = f'''package {package_name};

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.ValueCallback;
          import android.content.ActivityNotFoundException;

          public class MainActivity extends Activity {{
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {{
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {{

                          if (MainActivity.this.filePathCallback != null) {{
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                              MainActivity.this.filePathCallback = null;
                          }}

                          MainActivity.this.filePathCallback = filePathCallback;

                          try {{
                              Intent intent = fileChooserParams.createIntent();
                              startActivityForResult(
                                  intent,
                                  FILE_CHOOSER_REQUEST_CODE
                              );
                              return true;
                          }} catch (ActivityNotFoundException exception) {{
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }}
                      }}
                  }});

                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }}

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {{
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {{
                      if (filePathCallback == null) {{
                          return;
                      }}

                      Uri[] results = null;

                      if (resultCode == Activity.RESULT_OK && data != null) {{
                          results = WebChromeClient.FileChooserParams.parseResult(
                              resultCode,
                              data
                          );
                      }}

                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }}
              }}

              @Override
              public void onBackPressed() {{
                  if (webView != null && webView.canGoBack()) {{
                      webView.goBack();
                  }} else {{
                      super.onBackPressed();
                  }}
              }}
          }}
          '''

          (java_dir / "MainActivity.java").write_text(
              java_code,
              encoding="utf-8"
          )

          # Create launcher icons if an icon was uploaded.
          if icon_path:
              icon_file = source / icon_path

              if not icon_file.is_file():
                  raise SystemExit("ERROR: Uploaded app icon not found.")

              from PIL import Image

              image = Image.open(icon_file).convert("RGBA")

              for folder, size in [
                  ("mipmap-mdpi", 48),
                  ("mipmap-hdpi", 72),
                  ("mipmap-xhdpi", 96),
                  ("mipmap-xxhdpi", 144),
                  ("mipmap-xxxhdpi", 192)
              ]:
                  target = root / "app/src/main/res" / folder
                  target.mkdir(parents=True, exist_ok=True)

                  resized = image.resize(
                      (size, size),
                      Image.Resampling.LANCZOS
                  )

                  resized.save(target / "ic_launcher.png")

              application.set(
                  f"{{{android_ns}}}icon",
                  "@mipmap/ic_launcher"
              )

              ET.ElementTree(manifest).write(
                  manifest_path,
                  encoding="utf-8",
                  xml_declaration=True
              )

          print("Project files copied successfully.")
          print("App:", app_name)
          print("Package:", package_name)
          PY

      - name: Create Gradle Project
        run: |
          mkdir -p myapp/app

          cat > myapp/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'MyWebApp'
          include ':app'
          EOF

          cat > myapp/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          EOF

          cat > myapp/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.app.builder'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.app.builder'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          # Replace the default package settings with the user's package.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          build_id = os.environ["BUILD_ID"]
          config = json.loads(
              (Path("source/.build-input") / build_id / "build-config.json")
              .read_text(encoding="utf-8")
          )

          gradle_file = Path("myapp/app/build.gradle")
          content = gradle_file.read_text(encoding="utf-8")
          content = content.replace(
              "com.app.builder",
              config["packageName"]
          )
          gradle_file.write_text(content, encoding="utf-8")
          PY
        env:
          BUILD_ID: ${{ github.event.client_payload.buildId }}

      # ============================================================
      # Google AdMob (Google Mobile Ads SDK) — OLD DISABLED STEPS
      # Preserved from original workflow.
      # ============================================================
      - name: Configure Google Mobile Ads SDK dependency
        if: false
        shell: bash
        run: |
          set -euo pipefail

          ADMOB_SDK_VERSION="23.2.0"
          ADMOB_DEP_LINE="implementation 'com.google.android.gms:play-services-ads:${ADMOB_SDK_VERSION}'"

          APP_GRADLE="myapp/app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "❌ Expected Gradle file not found: $APP_GRADLE"
            exit 1
          fi
          echo "✅ Found app Gradle file: $APP_GRADLE"

          if grep -q "com.google.android.gms:play-services-ads" "$APP_GRADLE"; then
            echo "ℹ️ AdMob SDK dependency already present — skipping."
          else
            echo "➕ Adding Google Mobile Ads SDK ${ADMOB_SDK_VERSION} to ${APP_GRADLE}"
            if grep -qE '^[[:space:]]*dependencies[[:space:]]*\{' "$APP_GRADLE"; then
              awk -v dep="$ADMOB_DEP_LINE" '
                BEGIN { done=0 }
                /^[[:space:]]*dependencies[[:space:]]*\{/ && !done {
                  print
                  print "    " dep
                  done=1
                  next
                }
                { print }
              ' "$APP_GRADLE" > "$APP_GRADLE.tmp" && mv "$APP_GRADLE.tmp" "$APP_GRADLE"
            else
              printf '\n\ndependencies {\n    %s\n}\n' "$ADMOB_DEP_LINE" >> "$APP_GRADLE"
            fi
          fi

          echo "🔧 Ensuring Google Maven repository..."
          SETTINGS_GRADLE="myapp/settings.gradle"
          if grep -qE 'google\(\)|maven\.google\.com' "$SETTINGS_GRADLE"; then
            echo "ℹ️ Google Maven repo already present."
          else
            echo "➕ Adding google() to repositories."
            awk '
              BEGIN { done=0 }
              /repositories[[:space:]]*\{/ && !done {
                print
                print "            google()"
                done=1
                next
              }
              { print }
            ' "$SETTINGS_GRADLE" > "$SETTINGS_GRADLE.tmp" && mv "$SETTINGS_GRADLE.tmp" "$SETTINGS_GRADLE"
          fi

          echo "✅ Old AdMob SDK configuration step completed."

      - name: Verify AdMob SDK configuration
        if: false
        shell: bash
        run: |
          set -euo pipefail
          echo "🔎 Verifying AdMob SDK dependency and Google Maven repo..."
          FOUND_DEP=$(grep -R "com.google.android.gms:play-services-ads" --include='build.gradle' myapp || true)
          echo "--- AdMob dependency lines ---"
          echo "${FOUND_DEP:-<none>}"
          FOUND_REPO=$(grep -R -E 'google\(\)|maven\.google\.com' --include='settings.gradle' --include='build.gradle' myapp || true)
          echo "--- Google Maven repo lines ---"
          echo "${FOUND_REPO:-<none>}"
          if [ -z "$FOUND_DEP" ]; then
            echo "❌ AdMob SDK dependency was not added!"
            exit 1
          fi
          if [ -z "$FOUND_REPO" ]; then
            echo "❌ Google Maven repo not found!"
            exit 1
          fi
          echo "✅ Verification passed."

      # ============================================================
      # NEW CONDITIONAL ADMOB INTEGRATION
      # Runs only when admob.config.json exists and enabled is true.
      # ============================================================
      - name: Configure AdMob SDK and Android Java Bridge
        shell: bash
        run: |
          set -euo pipefail

          ASSET_CONFIG="myapp/app/src/main/assets/admob.config.json"

          if [ ! -f "$ASSET_CONFIG" ]; then
            echo "AdMob config not found. Building without AdMob."
            exit 0
          fi

          ENABLED=$(python3 -c "import json; print(str(json.load(open('$ASSET_CONFIG')).get('enabled', False)).lower())")

          if [ "$ENABLED" != "true" ]; then
            echo "AdMob is disabled. Building without AdMob SDK."
            exit 0
          fi

          echo "AdMob enabled. Configuring Google Mobile Ads SDK."

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          config_path = Path("myapp/app/src/main/assets/admob.config.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))

          app_id = config.get("appId", "").strip()

          if not app_id:
              raise SystemExit("ERROR: AdMob App ID is missing.")

          if not re.fullmatch(r"ca-app-pub-[0-9]+~[0-9]+", app_id):
              raise SystemExit("ERROR: Invalid AdMob App ID format.")

          android_ns = "http://schemas.android.com/apk/res/android"
          manifest_path = Path("myapp/app/src/main/AndroidManifest.xml")

          # ✅ YEH NAYI LINE ADD KAR DI GAYI HAI:
          ET.register_namespace("android", android_ns)

          tree = ET.parse(manifest_path)
          root = tree.getroot()
          application = root.find("application")

          if application is None:
              raise SystemExit("ERROR: Android application element not found.")

          for item in list(application):
              if item.tag == "meta-data" and item.get(
                  f"{{{android_ns}}}name"
              ) == "com.google.android.gms.ads.APPLICATION_ID":
                  application.remove(item)

          metadata = ET.SubElement(application, "meta-data")
          metadata.set(
              f"{{{android_ns}}}name",
              "com.google.android.gms.ads.APPLICATION_ID"
          )
          metadata.set(
              f"{{{android_ns}}}value",
              app_id
          )

          tree.write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True
          )

          print("AdMob App ID added to AndroidManifest.xml.")

          package_name = root.get("package")
          java_dir = Path("myapp/app/src/main/java") / Path(
              *package_name.split(".")
          )

          main_activity = java_dir / "MainActivity.java"
          source = main_activity.read_text(encoding="utf-8")

          bridge_line = (
              'webView.addJavascriptInterface('
              'new AdMobBridge(this, webView), "AndroidAds");'
          )

          if "new AdMobBridge(this, webView)" not in source:
              source = source.replace(
                  'webView.loadUrl("file:///android_asset/index.html");',
                  bridge_line + '\n                  '
                  'webView.loadUrl("file:///android_asset/index.html");'
              )

          main_activity.write_text(source, encoding="utf-8")

          bridge_code = r'''
          package PACKAGE_NAME;

          import android.app.Activity;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdSize;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.FullScreenContentCallback;
          import com.google.android.gms.ads.interstitial.InterstitialAd;
          import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback;
          import com.google.android.gms.ads.rewarded.RewardedAd;
          import com.google.android.gms.ads.rewarded.RewardedAdLoadCallback;
          import com.google.android.gms.ads.rewarded.RewardItem;
          import com.google.android.gms.ads.nativead.NativeAd;
          import com.google.android.gms.ads.nativead.NativeAdView;
          import com.google.android.gms.ads.nativead.NativeAdOptions;
          import com.google.android.gms.ads.nativead.NativeAd.OnNativeAdLoadedListener;
          import com.google.android.gms.ads.AdListener;
          import com.google.android.gms.ads.AdLoader;
          import com.google.android.gms.ads.appopen.AppOpenAd;
          import com.google.android.gms.ads.appopen.AppOpenAd.AppOpenAdLoadCallback;

          import org.json.JSONObject;

          public class AdMobBridge {
              private final Activity activity;
              private final WebView webView;

              private String bannerId = "";
              private String interstitialId = "";
              private String rewardedId = "";
              private String nativeId = "";
              private String appOpenId = "";

              private AdView bannerView;
              private InterstitialAd interstitialAd;
              private RewardedAd rewardedAd;
              private NativeAd nativeAd;
              private AppOpenAd appOpenAd;

              private boolean initialized = false;
              private boolean appOpenShown = false;

              public AdMobBridge(Activity activity, WebView webView) {
                  this.activity = activity;
                  this.webView = webView;
              }

              @JavascriptInterface
              public void configure(String json) {
                  try {
                      JSONObject cfg = new JSONObject(json);

                      bannerId = cfg.optString("bannerId", "");
                      interstitialId = cfg.optString("interstitialId", "");
                      rewardedId = cfg.optString("rewardedId", "");
                      nativeId = cfg.optString("nativeId", "");
                      appOpenId = cfg.optString("appOpenId", "");

                      activity.runOnUiThread(() -> {
                          if (initialized) return;

                          initialized = true;

                          MobileAds.initialize(activity, status -> {
                              loadInterstitial();
                              loadRewarded();
                              loadNative();
                              loadAppOpen();
                          });
                      });

                  } catch (Exception e) {
                      android.util.Log.e("AdMobBridge", "Config error", e);
                  }
              }

              @JavascriptInterface
              public void initialize() {
                  // Initialization is performed by configure().
              }

              @JavascriptInterface
              public boolean isReady() {
                  return initialized;
              }

              @JavascriptInterface
              public void showBanner() {
                  activity.runOnUiThread(() -> {
                      if (bannerId.isEmpty()) return;

                      if (bannerView != null) {
                          bannerView.setVisibility(View.VISIBLE);
                          return;
                      }

                      bannerView = new AdView(activity);
                      bannerView.setAdUnitId(bannerId);
                      bannerView.setAdSize(AdSize.BANNER);

                      FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              Gravity.BOTTOM
                          );

                      activity.addContentView(bannerView, params);
                      bannerView.loadAd(new AdRequest.Builder().build());
                  });
              }

              @JavascriptInterface
              public void hideBanner() {
                  activity.runOnUiThread(() -> {
                      if (bannerView != null) {
                          bannerView.setVisibility(View.GONE);
                      }
                  });
              }

              private void loadInterstitial() {
                  if (interstitialId.isEmpty()) return;

                  InterstitialAd.load(
                      activity,
                      interstitialId,
                      new AdRequest.Builder().build(),
                      new InterstitialAdLoadCallback() {
                          @Override
                          public void onAdLoaded(InterstitialAd ad) {
                              interstitialAd = ad;
                          }

                          @Override
                          public void onAdFailedToLoad(LoadAdError error) {
                              interstitialAd = null;
                          }
                      }
                  );
              }

              @JavascriptInterface
              public void showInterstitial() {
                  activity.runOnUiThread(() -> {
                      if (interstitialAd == null) {
                          loadInterstitial();
                          return;
                      }

                      interstitialAd.setFullScreenContentCallback(
                          new FullScreenContentCallback() {
                              @Override
                              public void onAdDismissedFullScreenContent() {
                                  interstitialAd = null;
                                  loadInterstitial();
                              }

                              @Override
                              public void onAdFailedToShowFullScreenContent(
                                      com.google.android.gms.ads.AdError error) {
                                  interstitialAd = null;
                                  loadInterstitial();
                              }
                          }
                      );

                      interstitialAd.show(activity);
                  });
              }

              private void loadRewarded() {
                  if (rewardedId.isEmpty()) return;

                  RewardedAd.load(
                      activity,
                      rewardedId,
                      new AdRequest.Builder().build(),
                      new RewardedAdLoadCallback() {
                          @Override
                          public void onAdLoaded(RewardedAd ad) {
                              rewardedAd = ad;
                          }

                          @Override
                          public void onAdFailedToLoad(LoadAdError error) {
                              rewardedAd = null;
                          }
                      }
                  );
              }

              @JavascriptInterface
              public void showRewarded() {
                  activity.runOnUiThread(() -> {
                      if (rewardedAd == null) {
                          loadRewarded();
                          return;
                      }

                      rewardedAd.setFullScreenContentCallback(
                          new FullScreenContentCallback() {
                              @Override
                              public void onAdDismissedFullScreenContent() {
                                  rewardedAd = null;
                                  loadRewarded();
                              }
                          }
                      );

                      rewardedAd.show(activity, rewardItem -> {
                          int amount = rewardItem.getAmount();
                          String type = rewardItem.getType();

                          webView.post(() -> webView.evaluateJavascript(
                              "if(window.onAdRewardEarned){"
                              + "window.onAdRewardEarned("
                              + amount + ",'"
                              + type.replace("'", "") + "');}",
                              null
                          ));
                      });
                  });
              }

              private void loadNative() {
                  if (nativeId.isEmpty()) return;

                  AdLoader loader = new AdLoader.Builder(activity, nativeId)
                      .forNativeAd(ad -> {
                          if (nativeAd != null) {
                              nativeAd.destroy();
                          }
                          nativeAd = ad;
                      })
                      .withNativeAdOptions(new NativeAdOptions.Builder().build())
                      .withAdListener(new AdListener() {
                          @Override
                          public void onAdFailedToLoad(LoadAdError error) {
                              nativeAd = null;
                          }
                      })
                      .build();

                  loader.loadAd(new AdRequest.Builder().build());
              }

              @JavascriptInterface
              public void showNative() {
                  activity.runOnUiThread(() -> {
                      if (nativeAd == null) {
                          loadNative();
                          return;
                      }

                      NativeAdView adView = new NativeAdView(activity);
                      FrameLayout container = new FrameLayout(activity);
                      container.setBackgroundColor(Color.WHITE);
                      container.setPadding(12, 8, 12, 8);

                      TextView headline = new TextView(activity);
                      headline.setTextColor(Color.BLACK);
                      headline.setTextSize(16);
                      headline.setMaxLines(2);

                      TextView body = new TextView(activity);
                      body.setTextColor(Color.DKGRAY);
                      body.setTextSize(13);

                      TextView button = new TextView(activity);
                      button.setTextColor(Color.WHITE);
                      button.setBackgroundColor(Color.rgb(30, 100, 210));
                      button.setPadding(18, 10, 18, 10);

                      FrameLayout.LayoutParams headlineParams =
                          new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          );

                      FrameLayout.LayoutParams bodyParams =
                          new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          );
                      bodyParams.topMargin = 48;

                      FrameLayout.LayoutParams buttonParams =
                          new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          );
                      buttonParams.topMargin = 92;

                      container.addView(headline, headlineParams);
                      container.addView(body, bodyParams);
                      container.addView(button, buttonParams);

                      adView.addView(container);
                      adView.setHeadlineView(headline);
                      adView.setBodyView(body);
                      adView.setCallToActionView(button);

                      headline.setText(nativeAd.getHeadline());
                      body.setText(nativeAd.getBody());
                      button.setText(nativeAd.getCallToAction());

                      adView.setNativeAd(nativeAd);

                      FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              Gravity.BOTTOM
                          );

                      activity.addContentView(adView, params);
                  });
              }

              private void loadAppOpen() {
                  if (appOpenId.isEmpty()) return;

                  AppOpenAd.load(
                      activity,
                      appOpenId,
                      new AdRequest.Builder().build(),
                      new AppOpenAdLoadCallback() {
                          @Override
                          public void onAdLoaded(AppOpenAd ad) {
                              appOpenAd = ad;

                              if (!appOpenShown) {
                                  appOpenShown = true;
                                  showAppOpenInternal();
                              }
                          }

                          @Override
                          public void onAdFailedToLoad(LoadAdError error) {
                              appOpenAd = null;
                          }
                      }
                  );
              }

              private void showAppOpenInternal() {
                  if (appOpenAd == null) {
                      loadAppOpen();
                      return;
                  }

                  appOpenAd.setFullScreenContentCallback(
                      new FullScreenContentCallback() {
                          @Override
                          public void onAdDismissedFullScreenContent() {
                              appOpenAd = null;
                              loadAppOpen();
                          }

                          @Override
                          public void onAdFailedToShowFullScreenContent(
                                  com.google.android.gms.ads.AdError error) {
                              appOpenAd = null;
                              loadAppOpen();
                          }
                      }
                  );

                  appOpenAd.show(activity);
              }

              @JavascriptInterface
              public void showAppOpen() {
                  activity.runOnUiThread(this::showAppOpenInternal);
              }
          }
          '''

          bridge_code = bridge_code.replace("PACKAGE_NAME", package_name)

